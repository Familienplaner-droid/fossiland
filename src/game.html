<title>Fossiland</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: mobile game shell — header with coin pill, one "dig site" card (era landscape over a framed pit), tool tray, fixed bottom nav. Single warm earth theme by choice. */
:root{
  --bg:#2a1c13; --bg2:#33231a; --panel:#3e2b1f; --panel-hi:#4d3627; --edge:#1c120c; --line:#5f4431;
  --fg:#fff3e2; --muted:#cdb59c; --ghost:#8a6f58;
  --tape:#ff5a8a; --tape-dk:#c23663; --tape-ink:#3a0717;
  --amber:#ffb53d; --amber-dk:#c47c14;
  --bone:#f4e7c8; --bone-dk:#b89c6a;
  --good:#8be0a4; --good-dk:#3f9a5f;
  --plinth:#241810;
  --f-display:"Lilita One","Arial Rounded MT Bold","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;
  background:repeating-linear-gradient(180deg,var(--bg) 0 46px,var(--bg2) 46px 52px,var(--bg) 52px 120px,#2e1f15 120px 128px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:10px calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--f-display);font-size:30px;line-height:1;margin:0;letter-spacing:.5px;color:var(--bone);text-shadow:0 3px 0 var(--edge)}
.logo span{color:var(--tape)}
.hdr-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:7px;background:var(--edge);border-radius:999px;padding:5px 12px 5px 5px;font-family:var(--f-display);font-size:18px;box-shadow:inset 0 -2px 0 rgba(255,255,255,.06)}
.coin{width:22px;height:22px;border-radius:50%;flex:none;background:url(assets/coin.webp) center/114% no-repeat,radial-gradient(circle at 35% 30%,#ffe3a1,var(--amber) 50%,var(--amber-dk))}
.coin.sm{width:16px;height:16px}
.pill small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel);box-shadow:0 3px 0 var(--edge);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}

/* chunky game buttons */
.btn{font:700 15px var(--f-body);border:0;border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--panel-hi);color:var(--fg);box-shadow:0 4px 0 var(--edge);flex:1;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.primary{background:var(--tape);color:var(--tape-ink);box-shadow:0 4px 0 var(--tape-dk);font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.3px}
.btn.primary:active{box-shadow:0 1px 0 var(--tape-dk)}
.btn.ad{background:var(--amber);color:#3d2200;box-shadow:0 4px 0 var(--amber-dk)}
.btn.ad:active{box-shadow:0 1px 0 var(--amber-dk)}
.btn.ad::before{content:"";width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* dig site */
.site{border-radius:20px;overflow:hidden;background:var(--edge);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.scene{position:relative;height:150px}
.scene canvas{display:block;width:100%;height:100%}
.scene-ov{position:absolute;inset:0;padding:10px 12px;background:linear-gradient(180deg,rgba(20,12,8,.42),rgba(20,12,8,0) 55%);display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.era-t{font-family:var(--f-display);font-size:26px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.25)}
.era-s{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.trail{align-self:flex-start;background:rgba(28,18,12,.72);backdrop-filter:blur(4px);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--bone)}
.trail b{font-family:var(--f-display);font-weight:400;font-size:15px;color:#fff;margin-left:2px}
/* Grabungsstelle: gemalter Rahmen (Wiese, Seil, Fähnchen), das Feld liegt genau in der Grube des Bildes.
   Abstände in % der Breite, passend zur Innenkante des Rasters im zugeschnittenen Bild (154/979 px breit, 186/1172 px hoch bei 1126×1316). */
.pit{padding:15.54% 13.06% 12.04% 13.68%;background:url(assets/pitframe.webp) center/100% 100% no-repeat,#5b7a2c;position:relative}
/* Schmale Handys hochkant: ins Bild hineinzoomen (118 %), damit die Felder groß genug für Kinderfinger bleiben */
@media (max-width:520px),(orientation:landscape) and (max-height:520px){.pit{padding:8.44% 6.41% 4.3% 7.14%;background-size:118% 118%}}
.pit canvas{display:block;width:100%;touch-action:manipulation;cursor:pointer}

.eras{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;margin-bottom:-6px;scrollbar-width:none}
.eras::-webkit-scrollbar{display:none}
.eras .era{flex:0 0 30%;scroll-snap-align:start;min-width:100px}
.era{border:0;border-radius:14px;padding:9px 6px 8px;cursor:pointer;background:var(--panel);box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;gap:1px}
.era b{font-family:var(--f-display);font-weight:400;font-size:17px}
.era small{font-size:11px;color:var(--muted);font-weight:700}
.era[aria-pressed="true"]{background:var(--bone);color:#3a2616;box-shadow:0 4px 0 var(--bone-dk)}
.era[aria-pressed="true"] small{color:#7a5a3a}
.era:disabled{opacity:.5;cursor:not-allowed}

.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.energy{display:flex;align-items:center;gap:8px}
.energy svg{width:22px;height:22px;flex:none;color:var(--amber)}
.bar{flex:1;height:16px;border-radius:999px;background:var(--edge);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(180deg,#ffd27a,var(--amber) 60%,var(--amber-dk));transition:width .2s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--f-body);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.chip{display:flex;align-items:center;gap:6px;background:var(--edge);border-radius:999px;padding:5px 11px;font-family:var(--f-display);font-size:15px;white-space:nowrap}
.chip svg{width:18px;height:18px;color:var(--bone)}

.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tools>.tool{grid-column:span 2}
.tools>.tool.sp{grid-column:span 3;flex-direction:row;justify-content:flex-start;gap:8px;padding:8px 22px 8px 10px;text-align:left}
.tool.sp .ti{width:40px;height:40px;margin:-4px 0}
.tool.sp span.tx{display:flex;flex-direction:column;min-width:0}
.tool.sp b{font-size:14.5px;line-height:1.1;overflow-wrap:anywhere}.tool.sp small{text-align:left}
.tool.sp.empty{opacity:.9;box-shadow:0 5px 0 var(--edge),inset 0 0 0 2px rgba(255,181,61,.45)}
.tap-hand{position:fixed;z-index:37;width:46px;height:46px;pointer-events:none;margin:-6px 0 0 -12px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));animation:taphand 1.1s ease-in-out infinite}
@keyframes taphand{0%,100%{transform:translate(8px,10px) scale(1)}45%{transform:translate(0,0) scale(.9)}55%{transform:translate(0,0) scale(.9)}}
@media (prefers-reduced-motion:reduce){.tap-hand{animation:none}}
.tool{border:0;border-radius:18px;padding:10px 6px 9px;cursor:pointer;background:var(--panel);box-shadow:0 5px 0 var(--edge);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .06s,box-shadow .06s;position:relative}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.tool svg{width:40px;height:40px}
.tool .ti{width:52px;height:52px;object-fit:contain;margin:-6px 0 -4px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.tool b{font-family:var(--f-display);font-weight:400;font-size:16px}
.tool small{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.tool[aria-pressed="true"]{background:var(--panel-hi);box-shadow:0 5px 0 var(--edge),inset 0 0 0 3px var(--tape)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool .badge{position:absolute;top:-6px;right:-4px;background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-size:13px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 0 var(--tape-dk)}
.tool.ad-t{background:var(--amber);color:#3d2200;box-shadow:0 5px 0 var(--amber-dk)}
.tool.ad-t small{color:#6b4300}
.hint{font-size:13px;color:var(--muted);margin:0;text-wrap:pretty}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--edge);padding:8px max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-shadow:0 -6px 18px rgba(0,0,0,.35)}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{position:relative;border:0;background:transparent;border-radius:14px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ghost);font-weight:700;font-size:12px}
nav button svg{width:26px;height:26px}
nav button[aria-selected="true"]{color:var(--bone);background:var(--panel)}
nav button[aria-selected="true"] svg{color:var(--tape)}

/* museum */
.sec-h{font-family:var(--f-display);font-weight:400;font-size:20px;margin:6px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700}
.mus{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--edge)}
.card.full{box-shadow:0 5px 0 var(--edge),inset 0 0 0 3px var(--good)}
.display{background:radial-gradient(ellipse at 50% 110%,#5a3e2a,var(--plinth) 70%);padding:10px 10px 0;position:relative}
.display svg,.display canvas{display:block;width:100%;height:auto;max-width:100%}
.card .body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .name{font-family:var(--f-display);font-size:21px;line-height:1.1}
.card p{margin:0;font-size:13px;color:var(--muted)}
.earn{display:flex;align-items:center;gap:5px;background:var(--good);color:#0f3a1d;border-radius:999px;padding:3px 10px 3px 4px;font-family:var(--f-display);font-size:14px;white-space:nowrap}
.cnt{font-family:var(--f-display);font-size:14px;color:var(--muted);white-space:nowrap}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pip{font-size:10.5px;font-weight:700;text-align:center;padding:4px 2px;border-radius:8px;background:var(--edge);color:var(--ghost);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pip.ok{background:var(--bone);color:#3a2616}
.pip.cr{background:var(--bone-dk);color:#3a2616}
.pip.lab{background:transparent;box-shadow:inset 0 0 0 1.5px var(--amber);color:var(--amber)}
.nb{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--tape);color:var(--tape-ink);font:700 11px var(--f-body);display:grid;place-items:center;padding:0 5px}
.bench{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:12px;box-shadow:0 5px 0 var(--edge)}
.bench>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.slabbox{position:relative;width:104px;height:104px;max-width:100%;border-radius:14px;background:radial-gradient(circle at 50% 55%,#5a3e2a,var(--edge) 75%);overflow:hidden}
.slabbox img{position:absolute;left:10px;top:10px;width:84px;height:84px;object-fit:contain}
.slabbox .rock{position:absolute;inset:0;background:url(assets/tiles.webp) no-repeat;background-size:900% 600%;transition:clip-path 1s linear}
.slabbox .rock::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,240,210,.35),transparent 18%)}
.bench b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.bench .meta{font-size:12.5px;color:var(--muted)}
.bench .bar{flex:none;height:18px}
.bench .btn{flex:none;align-self:flex-start;padding:8px 12px;font-size:13px}
.bench.free .slabbox,.bench.locked .slabbox{display:grid;place-items:center;color:var(--ghost);font-family:var(--f-display);font-size:30px}
.bench.locked{opacity:.6}
.queue{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.queue li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:8px 12px;font-size:14px}
.queue li img,.queue li svg{width:30px;height:30px;object-fit:contain;flex:none}
.queue li span{flex:1;min-width:0}
.queue li em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bignum{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:40px}
.card.locked .display{height:70px;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:var(--ghost)}

/* workshop */
.up{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border-radius:18px;padding:12px;box-shadow:0 5px 0 var(--edge)}
.up .ic{width:52px;height:52px;border-radius:14px;background:var(--edge);display:grid;place-items:center}
.up .ic svg{width:36px;height:36px}
.up .ic .ti{width:50px;height:50px;object-fit:contain}
.finds li .ti{width:30px;height:30px;object-fit:contain;flex:none}
.up b{font-family:var(--f-display);font-weight:400;font-size:18px}
.up p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.lv{display:flex;gap:3px;margin-top:5px}
.lv i{width:12px;height:6px;border-radius:3px;background:var(--edge)}
.lv i.on{background:var(--good)}
.up .btn{flex:none;font-family:var(--f-display);font-weight:400;font-size:16px;padding:9px 12px}

/* overlays & toast */
.overlay{position:fixed;inset:0;background:rgba(14,9,6,.78);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fade .2s}
.modal{width:100%;max-width:440px;background:var(--panel);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 var(--edge);animation:rise .28s cubic-bezier(.2,1.3,.4,1)}
.modal h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;text-align:center;text-wrap:balance}
.modal .sub{text-align:center;color:var(--muted);font-size:13px;margin:-6px 0 0}
.finds{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;max-height:40vh;overflow:auto}
.finds li{display:flex;align-items:center;gap:10px;background:var(--edge);border-radius:12px;padding:7px 10px;font-size:14px}
.finds li svg{width:26px;height:26px;flex:none}
.finds li span{flex:1;min-width:0}
.finds li em{font-style:normal;font-family:var(--f-display);font-size:15px;color:var(--amber);white-space:nowrap}
.finds li em.bad{color:var(--bone-dk)}
.finds li em.ok{color:var(--good)}
.adleft{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.adscreen{aspect-ratio:16/9;max-width:100%;border-radius:14px;background:repeating-linear-gradient(135deg,#4a3324 0 16px,#3f2b1e 16px 32px);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);position:relative;overflow:hidden}
.adscreen b{font-family:var(--f-display);font-weight:400;font-size:52px;color:var(--fg);line-height:1}
.adbar{position:absolute;left:0;bottom:0;height:6px;background:var(--amber);width:0}
/* start screen */
.title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;text-align:center;background:url(assets/keyart.webp) center 70%/cover no-repeat,var(--bg);padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.title::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,28,19,.28) 0%,rgba(42,28,19,0) 26%,rgba(42,28,19,0) 62%,rgba(42,28,19,.82) 86%,rgba(42,28,19,.95) 100%)}
.title .ttop,.title .tbot{display:flex;flex-direction:column;align-items:center;gap:10px}
.title .ttop{margin-top:4vh}
.title>*{position:relative}
.title .hero{width:min(94vw,460px);max-width:100%;aspect-ratio:190/96;background:url(assets/sk_trex.webp) center/contain no-repeat;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite;margin-bottom:-6px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(54px,17vw,84px);line-height:.9;margin:0;color:var(--bone);letter-spacing:1px;text-shadow:0 5px 0 var(--edge),0 12px 30px rgba(0,0,0,.55)}
.title h1 span{color:var(--tape)}
.title .tagline{margin:0;font-weight:700;color:var(--bone);font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.title .btn.primary{flex:none;min-width:min(240px,80vw);font-size:26px;padding:14px 30px;margin-top:10px}
.langpick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.langpick button{border:0;border-radius:999px;padding:7px 13px;background:rgba(28,18,12,.75);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.langpick button[aria-pressed="true"]{background:var(--bone);color:#3a2616}
@keyframes float{50%{transform:translateY(-9px)}}
/* tutorial */
.coach-spot{position:fixed;z-index:35;border-radius:18px;pointer-events:none;box-shadow:0 0 0 9999px rgba(14,9,6,.6);transition:left .25s,top .25s,width .25s,height .25s}
.coach-spot.ring{box-shadow:0 0 0 9999px rgba(14,9,6,.6),inset 0 0 0 3px var(--tape);animation:ring 1.4s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 9999px rgba(14,9,6,.6),inset 0 0 0 5px var(--amber)}}
.coach{position:fixed;left:50%;transform:translateX(-50%);z-index:36;width:min(440px,calc(100% - 24px));background:var(--bone);color:#2a1a0e;border-radius:20px;padding:14px 16px 12px;box-shadow:0 6px 0 var(--bone-dk),0 12px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px}
.coach b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.1}
.coach p{margin:0;font-size:14.5px;line-height:1.42}
.coach .crow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.coach .dots{display:flex;gap:4px}
.coach .dots i{width:7px;height:7px;border-radius:50%;background:#d6c39c}
.coach .dots i.on{background:var(--tape)}
.coach .skip{border:0;background:transparent;color:#7a5a3a;font-weight:700;font-size:13px;cursor:pointer;padding:6px 4px}
.coach .btn{flex:none;padding:9px 18px}
.iconbtn{position:relative}
.iconbtn .nb{top:-6px;left:auto;right:-6px}
.dq{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.dq li{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;background:var(--edge);border-radius:14px;padding:9px 10px}
.dq li .mi{width:38px;height:38px;display:grid;place-items:center}
.dq li .mi img,.dq li .mi svg{width:36px;height:36px;object-fit:contain}
.dq li>div{min-width:0}

for(const [l,o] of Object.entries({"de": {"play": "Spielen", "tagline": "Graben, Präparieren & Museum", "tutNext": "Weiter", "tutSkip": "Überspringen", "tutDone": "Viel Spaß beim Graben!", "tutReplay": "Anleitung ansehen", "t1h": "Willkommen in Fossiland!", "t1": "Du leitest eine Ausgrabung. Irgendwo in dieser Grube stecken die Knochen eines Urzeittiers. Ich zeige dir kurz, wie es geht.", "t2h": "Die Sonde", "t2": "Tippe auf die Sonde. Mit ihr findest du heraus, wo etwas im Boden liegt.", "t3h": "Suchen", "t3": "Tippe jetzt mitten ins Feld. Fähnchen zeigen dir, wo Knochen oder Schätze liegen.", "t4h": "Graben", "t4": "Tippe auf die Felder mit Fähnchen, bis der Knochen frei liegt. Manche Knochen liegen tiefer im Boden, dann grab einfach weiter nach unten. Der Pinsel ist sicher. Die Hacke gräbt schneller, kann Knochen aber anknacksen. Jedes Tippen kostet 1 Ausdauer.", "t5h": "Ab ins Labor", "t5": "Super, dein erster Fund! Frische Knochen stecken noch im Gestein. Tippe auf „{x}“.", "t6h": "Präparieren", "t6": "Hier wird dein Fund freigelegt. Normalerweise dauert das 1 bis 5 Stunden, auch wenn das Spiel geschlossen ist. Dein erster Knochen ist schon in einer Minute fertig.", "t7h": "Das Museum", "t7": "Fertige Knochen kommen ins Museum. Tippe auf „{x}“.", "t8h": "Skelette sammeln", "t8": "Fehlende Teile siehst du als Schatten. Ist ein Skelett komplett, zahlen Besucher Eintritt, auch während du nicht spielst. Komplette Skelette schalten neue Zeitalter frei.", "t9h": "Die Werkstatt", "t9": "Mit Münzen verbesserst du deine Ausrüstung. Tippe auf „{x}“.", "t10h": "Ausbauen", "t10": "Mehr Ausdauer, mehr Sonden, mehr Werkbänke: Hier lohnt es sich, regelmäßig vorbeizuschauen. Deine Ausdauer lädt sich übrigens von selbst wieder auf.", "t11h": "Weitergraben", "t11": "Das war's! Tippe auf „{x}“ und grab den Rest deines Tiers aus."}, "en": {"play": "Play", "tagline": "Fossil Dig, Prep & Museum", "tutNext": "Next", "tutSkip": "Skip", "tutDone": "Have fun digging!", "tutReplay": "Show tutorial", "t1h": "Welcome to Fossiland!", "t1": "You're running a dig. Somewhere in this pit lie the bones of a prehistoric animal. Let me show you how it works.", "t2h": "The probe", "t2": "Tap the probe. It shows you where something is buried.", "t3h": "Search", "t3": "Now tap the middle of the pit. Flags show where bones or treasures are.", "t4h": "Dig", "t4": "Tap the flagged squares until the bone is free. Some bones lie deeper, so just keep digging down. The brush is safe. The pickaxe is faster but can crack bones. Each tap costs 1 energy.", "t5h": "Off to the lab", "t5": "Great, your first find! Fresh bones are still stuck in rock. Tap “{x}”.", "t6h": "Preparing", "t6": "This is where your find is freed from the rock. Usually it takes 1 to 5 hours, even while the game is closed. Your first bone will be ready in one minute.", "t7h": "The museum", "t7": "Finished bones go to the museum. Tap “{x}”.", "t8h": "Collect skeletons", "t8": "Missing parts show up as shadows. Once a skeleton is complete, visitors pay entry fees, even while you're not playing. Complete skeletons unlock new eras.", "t9h": "The workshop", "t9": "Use coins to improve your gear. Tap “{x}”.", "t10h": "Upgrades", "t10": "More energy, more probes, more workbenches: it pays to check back here regularly. Your energy also refills by itself.", "t11h": "Keep digging", "t11": "That's it! Tap “{x}” and dig up the rest of your animal."}, "fr": {"play": "Jouer", "tagline": "Fouilles, préparation & musée", "tutNext": "Suivant", "tutSkip": "Passer", "tutDone": "Bonne fouille !", "tutReplay": "Revoir le tutoriel", "t1h": "Bienvenue à Fossiland !", "t1": "Tu diriges une fouille. Quelque part dans ce terrain se cachent les os d'un animal préhistorique. Je te montre comment faire.", "t2h": "La sonde", "t2": "Touche la sonde. Elle t'indique où quelque chose est enfoui.", "t3h": "Chercher", "t3": "Touche maintenant le milieu du terrain. Les drapeaux montrent où se trouvent des os ou des trésors.", "t4h": "Creuser", "t4": "Touche les cases avec un drapeau jusqu'à ce que l'os soit dégagé. Certains os sont plus profonds : continue simplement à creuser. Le pinceau est sûr. La pioche va plus vite mais peut fêler les os. Chaque coup coûte 1 d'énergie.", "t5h": "Direction le labo", "t5": "Bravo, ta première trouvaille ! Les os frais sont encore pris dans la roche. Touche « {x} ».", "t6h": "Préparer", "t6": "C'est ici que ta trouvaille est dégagée de la roche. D'habitude, cela prend de 1 à 5 heures, même quand le jeu est fermé. Ton premier os sera prêt dans une minute.", "t7h": "Le musée", "t7": "Les os prêts vont au musée. Touche « {x} ».", "t8h": "Collectionner", "t8": "Les pièces manquantes apparaissent en ombre. Quand un squelette est complet, les visiteurs paient l'entrée, même quand tu ne joues pas. Les squelettes complets débloquent de nouvelles ères.", "t9h": "L'atelier", "t9": "Utilise tes pièces pour améliorer ton matériel. Touche « {x} ».", "t10h": "Améliorations", "t10": "Plus d'énergie, plus de sondes, plus d'établis : ça vaut le coup de revenir ici souvent. Ton énergie se recharge aussi toute seule.", "t11h": "Continuer", "t11": "C'est tout ! Touche « {x} » et déterre le reste de ton animal."}, "es": {"play": "Jugar", "tagline": "Excava, prepara y exhibe", "tutNext": "Siguiente", "tutSkip": "Saltar", "tutDone": "¡Que disfrutes excavando!", "tutReplay": "Ver tutorial", "t1h": "¡Bienvenido a Fossiland!", "t1": "Diriges una excavación. En algún lugar de este terreno están los huesos de un animal prehistórico. Te enseño cómo funciona.", "t2h": "La sonda", "t2": "Toca la sonda. Te muestra dónde hay algo enterrado.", "t3h": "Buscar", "t3": "Ahora toca el centro del terreno. Las banderas indican dónde hay huesos o tesoros.", "t4h": "Excavar", "t4": "Toca las casillas con bandera hasta que el hueso quede libre. Algunos huesos están más hondos: sigue excavando hacia abajo. El pincel es seguro. El pico es más rápido, pero puede agrietar los huesos. Cada toque cuesta 1 de energía.", "t5h": "Al laboratorio", "t5": "¡Genial, tu primer hallazgo! Los huesos nuevos siguen atrapados en la roca. Toca «{x}».", "t6h": "Preparar", "t6": "Aquí se libera tu hallazgo de la roca. Normalmente tarda de 1 a 5 horas, incluso con el juego cerrado. Tu primer hueso estará listo en un minuto.", "t7h": "El museo", "t7": "Los huesos listos van al museo. Toca «{x}».", "t8h": "Colecciona esqueletos", "t8": "Las piezas que faltan se ven como sombras. Cuando un esqueleto está completo, los visitantes pagan entrada, incluso cuando no juegas. Los esqueletos completos desbloquean eras nuevas.", "t9h": "El taller", "t9": "Usa monedas para mejorar tu equipo. Toca «{x}».", "t10h": "Mejoras", "t10": "Más energía, más sondas, más mesas: merece la pena pasarse por aquí a menudo. Además, tu energía se recarga sola.", "t11h": "Sigue excavando", "t11": "¡Eso es todo! Toca «{x}» y desentierra el resto de tu animal."}}))Object.assign(TX[l],o);

cr": "Crailsheim", "sf_cr": "Der Muschelkalk um Crailsheim war einst ein flaches Meer voller Muscheln und Meeresreptilien.", "sn_is": "Ischigualasto", "sf_is": "Das „Tal des Mondes“ in Argentinien birgt einige der ältesten Dinosaurier der Welt.", "sn_gr": "Ghost Ranch", "sf_gr": "1947 entdeckte man hier ein Knochenlager mit Hunderten Coelophysis auf engem Raum.", "sn_so": "Solnhofen", "sf_so": "Aus den feinen Kalkplatten von Solnhofen machte man früher Drucksteine, dabei kam der Urvogel zum Vorschein.", "sn_hz": "Holzmaden", "sf_hz": "Im Ölschiefer von Holzmaden blieben Fischsaurier so gut erhalten, dass man sogar ihre Körperumrisse sieht.", "sn_dn": "Dinosaur National Monument", "sf_dn": "In einer einzigen Felswand stecken über 1.500 Dinosaurierknochen, man kann sie dort noch heute sehen.", "sn_gp": "Garden Park", "sf_gp": "Hier wurde 1877 einer der ersten Stegosaurier gefunden, mitten im Wettstreit zweier Forscher.", "sn_rg": "Riggs Hill", "sf_rg": "Auf diesem Hügel grub Elmer Riggs im Jahr 1900 den allerersten Brachiosaurus aus.", "sn_hc": "Hell Creek", "sf_hc": "In den Badlands von Montana liegen die letzten Dinosaurier vor dem großen Aussterben.", "sn_gb": "Flaming Cliffs", "sf_gb": "In den rot leuchtenden Klippen der Gobi fand man 1923 die ersten Dinosaurier-Eier.", "sn_kk": "Kem Kem", "sf_kk": "Die Kem-Kem-Schichten in Marokko waren einst ein Flusssystem voller Riesenfische und Spinosaurier.", "sn_nb": "Niobrara", "sf_nb": "Kansas lag in der Kreidezeit unter einem Meer, über dem Flugsaurier kreisten.", "sn_ma": "Maastricht", "sf_ma": "Nach dieser Stadt ist sogar der letzte Abschnitt der Kreidezeit benannt: das Maastrichtium.", "sn_ab": "Dinosaur Provincial Park", "sf_ab": "Im Dinosaur Provincial Park in Kanada wurden Hunderte Skelette von fast 50 Arten gefunden.", "sn_be": "Bernissart", "sf_be": "1878 stießen Bergleute in Bernissart in 322 Metern Tiefe auf fast 30 Iguanodons.", "sn_me": "Grube Messel", "sf_me": "Die Grube Messel ist UNESCO-Welterbe; hier blieben sogar Federn, Haut und Mageninhalte erhalten.", "sn_wh": "Wadi al-Hitan", "sf_wh": "Im „Tal der Wale“ liegen Urwal-Skelette mitten in der Wüste, wo einst ein Meer war.", "sn_im": "Innere Mongolei", "sf_im": "Von Andrewsarchus kennt man nur einen einzigen Schädel, gefunden 1923 in der Inneren Mongolei.", "sn_bu": "Bugti-Berge", "sf_bu": "In den Bugti-Bergen fand man 1910 die ersten Knochen des riesigen Paraceratherium.", "sn_si": "Jakutien", "sf_si": "Im Dauerfrost Jakutiens tauen immer wieder Mammuts mit Fell und Haut auf.", "sn_lb": "La Brea", "sf_lb": "In den Teergruben mitten in Los Angeles blieben über 2.000 Säbelzahnkatzen stecken.", "sn_fr": "Zoolithenhöhle", "sf_fr": "Die Zoolithenhöhle in der Fränkischen Schweiz ist voller Höhlenbärenknochen, schon vor 250 Jahren wurde hier geforscht.", "sn_ir": "Ballybetagh", "sf_ir": "In den Mooren bei Ballybetagh fand man über 100 Schädel von Riesenhirschen.", "sn_pa": "Luján", "sf_pa": "Am Fluss Luján fand man schon 1788 ein Riesenfaultier und später viele Glyptodons.", "ct_usa": "USA", "ct_rus": "Russland", "ct_bra": "Brasilien", "ct_ger": "Deutschland", "ct_arg": "Argentinien", "ct_mng": "Mongolei", "ct_mar": "Marokko", "ct_nld": "Niederlande", "ct_can": "Kanada", "ct_bel": "Belgien", "ct_egy": "Ägypten", "ct_chn": "China", "ct_pak": "Pakistan", "ct_irl": "Irland"}, "en": {"mapTitle": "Expedition map", "mapOpen": "Map", "mapHere": "You are digging here", "mapFly": "Fly there", "mapFlyFree": "Fly there for free", "mapLocked": "Opens at {n} finished skeletons", "mapNeed": "You have {a} of {b} plane tickets.", "mapSp": "Found here", "mapZoom": "Pinch to zoom, drag to move", "tixVideo": "+1 ticket with video", "tixBuy": "Buy 1 ticket", "tixAd": "Plane ticket", "tickets": "Plane tickets", "arrT": "Landed!", "arrGo": "Let's dig", "passT": "Passport", "passSub": "{a} of {b} dig sites visited", "siteGift": "Dig site cleared! +2 plane tickets", "chestTix": "+1 plane ticket", "newSites": "New dig sites on the map!", "siteDon "rareH": "Hallazgos raros", "rareSub": "{a} de {b} encontrados. Suelen estar al fondo del todo, y cada uno suma +{r} monedas por hora al museo.", "rareNew": "Nuevo en tu colección · +{v}", "rareDup": "Ya lo tienes · +{v}", "rareToMus": "A la vitrina", "rn_r_pyrite": "Amonites dorado", "rn_r_fern": "Huella de helecho", "rn_r_track": "Huella de dinosaurio", "rn_r_wood": "Madera petrificada", "rn_r_feather": "Pluma prehistórica", "rn_r_dragonfly": "Libélula en caliza", "rn_r_eggs": "Nido de dinosaurio", "rn_r_amberbug": "Mosquito en ámbar", "rn_r_beetle": "Escarabajo tornasolado", "rn_r_shark": "Diente de tiburón gigante", "rn_r_hair": "Pelo de mamut en hielo", "rn_r_saber": "Colmillo de sable", "rf_r_pyrite": "Aquí el mineral pirita sustituyó la concha. Brilla como el oro y por eso se llama oro de los tontos.", "rf_r_fern": "Los helechos crecían mucho antes que los dinosaurios. La hoja quedó prensada en barro que se volvió piedra.", "rf_r_track": "Una huella revela cuánto pesaba un animal y si caminaba o corría. Se llaman icnofósiles.", "rf_r_wood": "Durante millones de años, cristales sustituyeron la madera célula a célula. Aún se ven los anillos.", "rf_r_feather": "En las calizas de Solnhofen se conservaron hasta las plumas como impronta.", "rf_r_dragonfly": "El fino barro calizo de Solnhofen conservó incluso las venas de las alas.", "rf_r_eggs": "Algunos dinosaurios ponían sus huevos en nidos y probablemente los cuidaban.", "rf_r_amberbug": "La resina atrapó al mosquito. Se convirtió en ámbar y el insecto quedó casi intacto.", "rf_r_beetle": "En el yacimiento de Messel se conservaron incluso los colores tornasolados de los escarabajos.", "rf_r_shark": "Los dientes del tiburón gigante megalodón eran más grandes que una mano.", "rf_r_hair": "En el permafrost de Siberia se conservaron mamuts con piel y pelo.", "rf_r_saber": "El smilodon abría la boca más de 120 grados para morder con sus largos colmillos."}}))Object.assign(TX[l],o);
for(const [l,o] of Object.entries({"de": {"rn_r_helico": "Helicoprion-Zahnspirale", "rf_r_helico": "Dieser Urzeit-Fisch hatte keine normale Zahnreihe, sondern eine Spirale aus Zähnen im Unterkiefer. Neue Zähne wuchsen innen nach, alte rollten nach außen.", "rn_r_crinoid": "Seelilie", "rf_r_crinoid": "Sie sieht aus wie eine Pflanze, ist aber ein Tier: ein Verwandter der Seesterne. Mit ihren gefiederten Armen fing sie winzige Nahrung aus dem Wasser.", "rn_r_ceratit": "Ceratit", "rf_r_ceratit": "Ceratiten lebten im flachen Meer, das in der Trias über Süddeutschland lag. Die Zickzack-Linien zeigen, wo innen die Kammerwände saßen.", "rn_r_copro": "Koprolith", "rf_r_copro": "Ja, das ist versteinerter Kot! Forscher lieben solche Funde, denn darin stecken oft Knochen- oder Pflanzenreste. So weiß man, was ein Tier gefressen hat.", "rn_r_belem": "Belemnit", "rf_r_belem": "Belemniten waren tintenfischähnliche Tiere. Erhalten ist nur ihr Rückenstück. Früher glaubte man, es seien Donnerkeile, die bei Gewitter vom Himmel fallen.", "rn_r_limulus": "Pfeilschwanzkrebs", "rf_r_limulus": "Pfeilschwanzkrebse gibt es heute noch fast genauso wie im Jura. Sie sind keine echten Krebse, sondern mit Spinnen verwandt.", "rn_r_urchin": "Versteinerter Seeigel", "rf_r_urchin": "Das Sternmuster zeigt, wo früher die Füßchen des Seeigels saßen. Solche Seeigel findet man oft in Kreidefelsen, zum Beispiel auf Rügen.", "rn_r_ammolit": "Ammolit", "rf_r_ammolit": "Bei diesem Ammoniten hat sich die Schale in einen schillernden Edelstein verwandelt. Ammolit gibt es fast nur in Kanada und er ist sehr selten.", "rn_r_fish": "Fossiler Fisch", "rf_r_fish": "In einem alten See sanken tote Fische auf den Grund und wurden schnell von feinem Schlamm bedeckt. Deshalb sieht man noch jede Gräte.", "rn_r_palm": "Fossiles Palmblatt", "rf_r_palm": "Nach dem Aussterben der Dinosaurier war es auf der Erde viel wärmer als heute. Sogar in Deutschland wuchsen damals Palmen.", "rn_r_molar": "Mammut-Backenzahn", "rf_r_molar": "Ein einziger Mammutzahn konnte so schwer sein wie ein Ziegelstein. Mit den Rillen zermahlte das Mammut zähes Gras.", "rn_r_handaxe": "Faustkeil", "rf_r_handaxe": "Kein Fossil, sondern ein Werkzeug! Steinzeitmenschen schlugen Faustkeile aus Feuerstein. Sie lebten zur gleichen Zeit wie Mammut und Säbelzahnkatze."}, "en": {"rn_r_helico": "Helicoprion tooth whorl", "rf_r_helico": "This ancient fish had no normal row of teeth but a spiral of teeth in its lower jaw. New teeth grew in the middle, old ones rolled outwards.", "rn_r_crinoid": "Sea lily", "rf_r_crinoid": "It looks like a plant but is an animal, a relative of starfish. With its feathery arms it caught tiny food from the water.", "rn_r_ceratit": "Ceratite", "rf_r_ceratit": "Ceratites lived in the shallow sea that covered southern Germany in the Triassic. The zig-zag lines show where the chamber walls sat inside.", "rn_r_copro": "Coprolite", "rf_r_copro": "Yes, this is fossil poo! Scientists love these finds because they often contain bits of bone or plants. That shows what an animal ate.", "rn_r_belem": "Belemnite", "rf_r_belem": "Belemnites were squid-like animals. Only the hard part from inside their body survives. People once thought they were thunderbolts fallen from the sky.", "rn_r_limulus": "Horseshoe crab", "rf_r_limulus": "Horseshoe crabs still live today, looking almost the same as in the Jurassic. They are not real crabs but relatives of spiders.", "rn_r_urchin": "Fossil sea urchin", "rf_r_urchin": "The star pattern shows where the urchin's tiny tube feet once were. Such urchins are often found in chalk cliffs.", "rn_r_ammolit": "Ammolite", "rf_r_ammolit": "This ammonite's shell has turned into a shimmering gemstone. Ammolite comes almost only from Canada and is very rare.", "rn_r_fish": "Fossil fish", "rf_r_fish": "In an ancient lake, dead fish sank to the bottom and were quickly covered by fine mud. That is why you can still see every bone.", "rn_r_palm": "Fossil palm leaf", "rf_r_palm": "After the dinosaurs died out, the Earth was much warmer than today. Palm trees even grew in Germany back then.", "rn_r_molar": "Mammoth molar", "rf_r_molar": "A single mammoth tooth could weigh as much as a brick. The mammoth ground tough grass with its ridges.", "rn_r_handaxe": "Hand axe", "rf_r_handaxe": "Not a fossil but a tool! Stone Age people knapped hand axes from flint. They lived at the same time as mammoths and sabre-toothed cats."}, "fr": {"rn_r_helico": "Spirale dentaire d'Hélicoprion", "rf_r_helico": "Ce poisson préhistorique n'avait pas une rangée de dents normale, mais une spirale de dents dans la mâchoire inférieure. Les nouvelles dents poussaient au centre.", "rn_r_crinoid": "Lys de mer", "rf_r_crinoid": "On dirait une plante, mais c'est un animal, un cousin des étoiles de mer. Avec ses bras plumeux, il attrapait de minuscules aliments dans l'eau.", "rn_r_ceratit": "Cératite", "rf_r_ceratit": "Les cératites vivaient dans la mer peu profonde qui recouvrait le sud de l'Allemagne au Trias. Les lignes en zigzag montrent les cloisons internes.", "rn_r_copro": "Coprolithe", "rf_r_copro": "Oui, c'est du caca fossilisé ! Les chercheurs adorent ces trouvailles, car elles contiennent souvent des restes d'os ou de plantes. On sait ainsi ce que l'animal mangeait.", "rn_r_belem": "Bélemnite", "rf_r_belem": "Les bélemnites ressemblaient à des calmars. Seule la partie dure de leur corps est conservée. Autrefois, on les croyait tombées du ciel pendant les orages.", "rn_r_limulus": "Limule", "rf_r_limulus": "Les limules vivent encore aujourd'hui, presque identiques à celles du Jurassique. Ce ne sont pas de vrais crabes, mais des cousins des araignées.", "rn_r_urchin": "Oursin fossile", "rf_r_urchin": "Le motif en étoile montre où se trouvaient les petits pieds de l'oursin. On en trouve souvent dans les falaises de craie.", "rn_r_ammolit": "Ammolite", "rf_r_ammolit": "La coquille de cette ammonite s'est transformée en pierre précieuse irisée. L'ammolite vient presque uniquement du Canada et elle est très rare.", "rn_r_fish": "Poisson fossile", "rf_r_fish": "Dans un ancien lac, les poissons morts coulaient au fond et étaient vite recouverts de vase fine. C'est pourquoi on voit encore chaque arête.", "rn_r_palm": "Feuille de palmier fossile", "rf_r_palm": "Après la disparition des dinosaures, la Terre était bien plus chaude qu'aujourd'hui. Des palmiers poussaient même en Allemagne.", "rn_r_molar": "Molaire de mammouth", "rf_r_molar": "Une seule dent de mammouth pouvait peser autant qu'une brique. Avec ses crêtes, le mammouth broyait l'herbe dure.", "rn_r_handaxe": "Biface", "rf_r_handaxe": "Pas un fossile, mais un outil ! Les hommes préhistoriques taillaient des bifaces dans le silex. Ils vivaient à l'époque des mammouths."}, "es": {"rn_r_helico": "Espiral dental de Helicoprion", "rf_r_helico": "Este pez prehistórico no tenía una fila normal de dientes, sino una espiral de dientes en la mandíbula inferior. Los dientes nuevos crecían en el centro.", "rn_r_crinoid": "Lirio de mar", "rf_r_crinoid": "Parece una planta, pero es un animal, pariente de las estrellas de mar. Con sus brazos plumosos atrapaba diminutos alimentos del agua.", "rn_r_ceratit": "Ceratites", "rf_r_ceratit": "Los ceratites vivían en el mar poco profundo que cubría el sur de Alemania en el Triásico. Las líneas en zigzag muestran las paredes internas.", "rn_r_copro": "Coprolito", "rf_r_copro": "¡Sí, es caca fosilizada! A los científicos les encantan, porque suelen contener restos de huesos o plantas. Así se sabe qué comía un animal.", "rn_r_belem": "Belemnites", "rf_r_belem": "Los belemnites eran parecidos a calamares. Solo se conserva la parte dura de su cuerpo. Antes se creía que eran rayos caídos del cielo.", "rn_r_limulus": "Cangrejo herradura", "rf_r_limulus": "Los cangrejos herradura aún viven hoy, casi iguales que en el Jurásico. No son cangrejos de verdad, sino parientes de las arañas.", "rn_r_urchin": "Erizo de mar fósil", "rf_r_urchin": "El dibujo de estrella muestra dónde estaban los pies del erizo. Se encuentran a menudo en acantilados de creta.", "rn_r_ammolit": "Amolita", "rf_r_ammolit": "La concha de este amonites se ha convertido en una gema iridiscente. La amolita viene casi solo de Canadá y es muy rara.", "rn_r_fish": "Pez fósil", "rf_r_fish": "En un antiguo lago, los peces muertos se hundían y quedaban cubiertos de barro fino. Por eso aún se ve cada espina.", "rn_r_palm": "Hoja de palmera fósil", "rf_r_palm": "Tras la extinción de los dinosaurios, la Tierra era mucho más cálida que hoy. Incluso en Alemania crecían palmeras.", "rn_r_molar": "Muela de mamut", "rf_r_molar": "Una sola muela de mamut podía pesar tanto como un ladrillo. Con sus crestas trituraba la hierba dura.", "rn_r_handaxe": "Hacha de mano", "rf_r_handaxe": "¡No es un fósil, sino una herramienta! Los humanos de la Edad de Piedra tallaban hachas de sílex. Vivían en la época de los mamuts."}}))Object.assign(TX[l],o);

function tickLab(now){const done=[];let guard=0;
  while(guard++<300){
    const act=S.lab.filter(x=>x.st!=null).sort((a,b)=>(a.st+a.dur)-(b.st+b.dur));
    if(act.length<labSlots()){const w=S.lab.find(x=>x.st==null);if(w){w.st=now;continue}}
    const f=act[0];
    if(f&&f.st+f.dur<=now){const t=f.st+f.dur;S.lab.splice(S.lab.indexOf(f),1);applyPart(f);done.push(f);const w=S.lab.find(x=>x.st==null);if(w)w.st=t;continue}
    break}
  if(done.length)save();
  return done}

  const before=ERAS.map((e,k)=>unlocked(k)),wasFull=isFull(c);
  m[x.part]=x.cr?"cr":"ok";

/* ================= Belohnungs-Werbung =================
   In der Android-App: echte AdMob-Videos (zurzeit Googles Test-Anzeigen).
   Im Browser und in der HTML-Datei: Platzhalter mit 5-Sekunden-Video.
   Für den Store nur AD_UNIT (und die App-ID in strings.xml) gegen die eigenen IDs tauschen und ADS_TESTING auf false setzen. */
const AD_UNIT="ca-app-pub-3940256099942544/5224354917";   // Googles Test-ID für Belohnungsvideos
const ADS_TESTING=true;
const ADM=(()=>{try{return window.capacitorExports&&capacitorExports.Capacitor.isNativePlatform()&&window.capacitorStripe&&capacitorStripe.AdMob?capacitorStripe.AdMob:null}catch(e){return null}})();
const ADQ={init:null,ready:false,loading:null,earned:false,done:null};
// Letzte Werbefehler für den Testbericht: [Spieltag, Uhrzeit, Schritt, Code, Meldung, online]
function adErr(step,e){try{const x=SS();x.adErr=x.adErr||[];const d=new Date();
  x.adErr.push([dayNo(),d.toTimeString().slice(0,5),step,e&&e.code!=null?e.code:"",String((e&&(e.message||e.errorMessage))||e||"").slice(0,120),navigator.onLine?1:0]);
  if(x.adErr.length>12)x.adErr.shift();save()}catch(_){}}
// Spielfehler für den Testbericht: [Spieltag, Uhrzeit, Meldung, Zeile, Ansicht]
function jsErr(msg,line){try{const x=SS();x.jsErr=(x.jsErr||[]).filter(e=>!/ResizeObserver/.test(e[2]));const d=new Date(),v=document.querySelector("section[id^=\"v-\"]:not([hidden])");
  const m=String(msg||"").slice(0,140),last=x.jsErr[x.jsErr.length-1];if(last&&last[2]===m&&last[3]===line){last[5]=(last[5]||1)+1;save();return}
  x.jsErr.push([dayNo(),d.toTimeString().slice(0,5),m,line||0,v?v.id.replace("v-",""):"",1]);if(x.jsErr.length>12)x.jsErr.shift();save()}catch(_){}}
addEventListener("error",e=>{if(e.message&&!/ResizeObserver loop/.test(e.message))jsErr(e.message,e.lineno)});   // ResizeObserver-Meldung ist eine harmlose Browser-Warnung
addEventListener("unhandledrejection",e=>jsErr("Promise: "+((e.reason&&(e.reason.message||e.reason))||"?"),0));
function admInit(){if(!ADM)return Promise.resolve(false);if(ADQ.init)return ADQ.init;
  ADQ.init=(async()=>{try{
    await ADM.initialize({initializeForTesting:ADS_TESTING,tagForChildDirectedTreatment:true,tagForUnderAgeOfConsent:true,maxAdContentRating:"General"});
    ADM.addListener("onRewardedVideoAdReward",()=>{ADQ.earned=true});
    ADM.addListener("onRewardedVideoAdDismissed",()=>{const f=ADQ.done;ADQ.done=null;ADQ.ready=false;if(f)f(ADQ.earned);admLoad()});
    ADM.addListener("onRewardedVideoAdFailedToLoad",e=>{ADQ.lastErr=e});
    ADM.addListener("onRewardedVideoAdFailedToShow",e=>{adErr("zeigen",e);const f=ADQ.done;ADQ.done=null;ADQ.ready=false;if(f)f(null);admLoad()});
    admLoad();return true}catch(e){adErr("start",e);return false}})();
  return ADQ.init}
function admLoad(){if(!ADM||ADQ.ready)return Promise.resolve(ADQ.ready);if(ADQ.loading)return ADQ.loading;
  ADQ.loading=ADM.prepareRewardVideoAd({adId:AD_UNIT,isTesting:ADS_TESTING}).then(()=>{ADQ.ready=true;return true},e=>{ADQ.failErr=ADQ.lastErr&&ADQ.lastErr.code!=null?ADQ.lastErr:e;ADQ.lastErr=null;return false}).finally(()=>{ADQ.loading=null});
  return ADQ.loading}

/* --- Besucher: laufen über freie Felder (Ausstellungsfläche und Gänge) von Saal zu Saal und bleiben vor Exponaten stehen.

const HVIS=["dad","kid","opa","cam","teen"],HVH=78;   // Figurenhöhe in Weltpunkten
function hVisCount(){const n=Object.keys(S.hall.it).length+Object.keys(S.hall.rv||{}).length;return n?Math.min(14,2+Math.floor(n/3))*(expoOn()?2:1):0}
function hWalk(){const G=hGeo(),w=new Uint8Array(HN*HN);for(let q=0;q<HN*HN;q++)w[q]=G.fl[q]?1:0;   // begehbar = Boden ohne Exponat

  const G=hGeo();for(const q of cells){const i=Math.floor(q/HN),j=q%HN;if(G.fl[q]===1&&[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const n=(i+a)*HN+j+b;return i+a>=0&&j+b>=0&&i+a<HN&&j+b<HN&&!w[n]&&G.fl[n]}))near.push(q)}   // Felder direkt vor einem Exponat

  for(const v of HV.vis){
    if(v.path.length){const q=v.path[0],ti=Math.floor(q/HN)+.5,tj=q%HN+.5,di=ti-v.i,dj=tj-v.j,d=Math.hypot(di,dj),sp=(v.t==="opa"?1.1:1.6)*dt;
      if(d<=sp){v.i=ti;v.j=tj;v.path.shift();if(!v.path.length)v.wait=2+Math.random()*4}else{v.i+=di/d*sp;v.j+=dj/d*sp;v.dir=[Math.sign(Math.round(di*10)),Math.sign(Math.round(dj*10))]}

function labTimeline(now){const L=S.lab.map(x=>({...x})),out=[],slots=labSlots();let g=0;
  while(g++<300){const act=L.filter(x=>x.st!=null).sort((a,b)=>(a.st+a.dur)-(b.st+b.dur));
    if(act.length<slots){const w=L.find(x=>x.st==null);if(w){w.st=now;continue}}
    const f=act[0];if(!f)break;const tt=f.st+f.dur;out.push({t:tt,x:f});L.splice(L.indexOf(f),1);const w=L.find(x=>x.st==null);if(w)w.st=tt}
  return out}

    if(g&&t2-g.t<=10*60000){g.items.push(e.x);g.t=Math.max(g.t,t2)}else groups.push({t:t2,items:[e.x]})}

    ...(x.ev.length?x.ev.slice(-15).map(e=>`  Tag ${e[0]}: ${e[1]}`):["  keine"]),
    "",
    "Daten für die Auswertung (bitte mitschicken):",
    "FSL1:"+reportData()
  ];
  return lines.join("\n");
}
// Kompakte Zahlen für die Auswertungsseite, als eine Zeile Base64
function reportData(){const x=SS(),c=x.c;   // Reisen: c.flights, c.tixAd, c.tixBuy
  const d={v:1,id:x.id,name:x.name||"",lang:LANG,app:ADM?1:0,start:x.start,at:Date.now(),
    days:Object.fromEntries(Object.entries(x.days).map(([k,v])=>[k,[v.s||0,v.sec||0,v.a||0]])),
    ads:c.ads||0,adCancel:c.adCancel||0,adFail:c.adFail||0,adErr:(x.adErr||[]).slice(-5),jsErr:(x.jsErr||[]).slice(-5),adKinds:Object.fromEntries(Object.keys(c).filter(k=>k.startsWith("ad:")).map(k=>[k.slice(3),c[k]])),
    flights:c.flights||0,sites:Object.keys(S.visited||{}).length,done:completed(),eras:ERAS.filter((e,i)=>unlocked(i)).length,digs:c.digsStarted||0,bones:c.bones||0,streak:x.maxStreak||0,tut:x.tut||""};
  return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
const SHR=(()=>{try{return window.capacitorExports&&capacitorExports.Capacitor.isNativePlatform()&&window.capacitorShare?capacitorShare.Share:null}catch(e){return null}})();
function showReport(){
  const x=SS();
  const ov=overlay(`<h2>${t("reportT")}</h2><p class="sub">${t("reportSub")}</p>
    <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)">${t("tName")}<input id="repName" maxlength="24" placeholder="${t("tNamePh")}" style="font:15px var(--f-body);padding:10px 12px;border:0;border-radius:12px;background:var(--edge);color:var(--fg)"></label>
    <textarea class="report" id="repTxt" readonly></textarea>
    <div class="row"><button class="btn" id="repClose">${t("close")}</button><button class="btn" id="repCopy">${t("copy")}</button><button class="btn primary" id="repShare">${t("share")}</button></div>`);
  const ta=ov.querySelector("#repTxt"),nm=ov.querySelector("#repName");nm.value=x.name||"";ta.value=reportText();
  nm.addEventListener("input",()=>{x.name=nm.value.trim().slice(0,24);save();ta.value=reportText()});
  const copy=txt=>{const fb=()=>{ta.focus();ta.select();toast(t("copyFail"))};try{navigator.clipboard.writeText(txt).then(()=>{SFX.coin();toast(t("copied"))},fb)}catch(err){fb()}};
  ov.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();const txt=reportText();ta.value=txt;
    if(b.id==="repClose"){ov.remove();return}
    if(b.id==="repCopy"){copy(txt);return}
    if(b.id==="repShare"){const title="Fossiland Testbericht "+(x.name||x.id);
      try{if(SHR){await SHR.share({title,text:txt,dialogTitle:t("share")});return}
        if(navigator.share){await navigator.share({title,text:txt});return}}catch(err){if(err&&/cancel|abort/i.test(String(err.message||err.name)))return}
      copy(txt)}});
}

/* ================= Startbildschirm & Anleitung ================= */
// Posen der Paläontologin: wave (Standard), point, think, lab, wow, cheer
const gpose=(g,full)=>g&&g!=="wave"?`guide_${g}${full?"":"_bust"}.webp`:(full?"guide.webp":"guide_bust.webp");
const HAND_SVG=`<svg viewBox="0 0 48 48" width="46" height="46"><path d="M17 26V9.5a3.5 3.5 0 0 1 7 0V22l1-.2v-3.3a3.3 3.3 0 0 1 6.6 0v3.6l.8-.1a3.2 3.2 0 0 1 6.3.6v2.8a3 3 0 0 1 5.6 1.5v7.6c0 6.3-5 11.5-11.3 11.5h-4.4c-3.7 0-7.1-1.9-9.1-5L9.9 33.6a3.3 3.3 0 0 1 5-4.2z" fill="#fff4e2" stroke="#3a2616" stroke-width="2.4" stroke-linejoin="round"/></svg>`;
const TUT=[
  {k:"t1",sel:null},
  {k:"t2",sel:'[data-tool="probe"]',wait:"probeSel",skipIf:()=>!D||D.probes<1,g:"point"},
  {k:"t3",sel:"#pit",wait:"probe",skipIf:()=>!D||D.probes<1&&tool!=="probe",g:"think"},
  {k:"t4",sel:"#pit",wait:"bone",g:"point"},
  {k:"t5",sel:"#t-lab",wait:"view:lab",x:"navLab",g:"point"},
  {k:"t6",sel:".bench",g:"lab"},
  {k:"t7",sel:"#t-mus",wait:"view:mus",x:"navMus",g:"point"},
  {k:"t8",sel:"#v-mus .card",g:"wow"},
  {k:"t9",sel:"#t-shop",wait:"view:shop",x:"navShop",g:"point"},
  {k:"t10",sel:"#v-shop .up",g:"think"},
  {k:"tmap",sel:"#tixPill",g:"point"},
  {k:"tdq",sel:"#dqBtn",g:"point"},
  {k:"t11",sel:"#t-dig",wait:"view:dig",x:"navDig",g:"cheer"}
];
let tutI=-1,tutReplay=false,tutTimer=null;
function startTut(replay){tutReplay=!!replay;if(!replay&&!SS().tut)SS().tut="begonnen";tutI=-1;tutGo(0)}
function tutGo(i){
  while(i<TUT.length&&TUT[i].skipIf&&TUT[i].skipIf())i++;
  tutI=i;document.querySelectorAll(".coach,.coach-spot,.tap-hand").forEach(e=>e.remove());clearInterval(tutTimer);
  if(i>=TUT.length){endTut(true);return}
  const st=TUT[i],spot=document.createElement("div"),box=document.createElement("div");
  spot.className="coach-spot"+(st.wait?" ring":"");box.className="coach";box.setAttribute("role","dialog");box.setAttribute("aria-live","polite");
  const showNext=!st.wait||tutReplay;
  box.innerHTML=`<img class="guide" src="${aurl(gpose(st.g))}" alt=""><b>${t(st.k+"h")}</b><p>${t(st.k,{x:st.x?t(st.x):""})}</p>
    <div class="crow"><div class="dots">${TUT.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>
    <div><button class="skip" data-tut="skip">${t("tutSkip")}</button>${showNext?` <button class="btn primary" data-tut="next">${i===TUT.length-1&&!st.wait?t("letsGo"):t("tutNext")}</button>`:""}</div></div>`;
  document.body.append(spot,box);
  // Tipp-Hand: zeigt bei Schritten zum Antippen genau, wohin
  let hand=null;if(st.wait){hand=document.createElement("div");hand.className="tap-hand";hand.innerHTML=HAND_SVG;document.body.append(hand)}
  box.addEventListener("click",e=>{const b=e.target.closest("[data-tut]");if(!b)return;e.stopPropagation();SFX.click();b.dataset.tut==="skip"?endTut(false):tutGo(tutI+1)});
  const el=st.sel&&document.querySelector(st.sel);
  if(el&&!el.closest("nav")){const r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-90)el.scrollIntoView({block:"center",behavior:"smooth"})}
  const place=()=>{
    const hide=!!document.querySelector(".overlay,.title");spot.hidden=box.hidden=hide;if(hand)hand.hidden=hide;if(hide)return;
    const t=st.sel&&document.querySelector(st.sel);
    if(!t){spot.style.cssText="left:50%;top:50%;width:0;height:0";box.style.top="";box.style.bottom=`calc(${Math.round(innerHeight*.5)-80}px)`;return}
    const r=t.getBoundingClientRect(),p=6;
    spot.style.cssText=`left:${r.left-p}px;top:${r.top-p}px;width:${r.width+2*p}px;height:${r.height+2*p}px`;
    if(hand){let hx=r.left+r.width/2,hy=r.top+r.height/2;
      // im Grabungsfeld auf das nächste Feld des Knochens zeigen
      if(st.sel==="#pit"&&D){const o=D.objs.find(o=>o.kind==="bone"&&!o.found);const c=o&&o.cells.find(([y,x])=>!cellDone(D.grid[y*COLS+x]));if(c){hx=r.left+(c[1]+.5)*cs;hy=r.top+(c[0]+.5)*cs}}
      hand.style.left=hx+"px";hand.style.top=hy+"px";hand.hidden=hide}
    const bh=box.offsetHeight,below=innerHeight-r.bottom-p-12,above=r.top-p-12;
    if(r.top+r.height/2>innerHeight/2&&above>=bh){box.style.top="";box.style.bottom=(innerHeight-r.top+p+12)+"px"}
    else if(below>=bh){box.style.bottom="";box.style.top=(r.bottom+p+12)+"px"}
    else{box.style.bottom="";box.style.top="calc(12px + env(safe-area-inset-top,0px))"}
  };
  place();tutTimer=setInterval(place,150);
}
function tutEvent(ev){if(tutI<0||tutI>=TUT.length)return;if(TUT[tutI].wait===ev)tutGo(tutI+1)}
function endTut(done){document.querySelectorAll(".tap-hand").forEach(e=>e.remove());if(!tutReplay)SS().tut=done?"bis zum Ende gespielt":"übersprungen bei Schritt "+(tutI+1)+" von "+TUT.length;clearInterval(tutTimer);document.querySelectorAll(".coach,.coach-spot").forEach(e=>e.remove());tutI=-1;S.tutDone=1;save();if(done)toast(t("tutDone"));setTimeout(()=>{try{maybeAskNotif()}catch(e){}},2500)}

function showTitle(){
  const el=document.createElement("div");el.className="title";el.setAttribute("role","dialog");el.setAttribute("aria-label","Fossiland");
  const draw=()=>{el.innerHTML=`<div class="ttop"><h1>Fossi<span>land</span></h1><p class="tagline">${t("tagline")}</p></div><div class="tbot">
    <button class="btn primary" id="playBtn">${t("play")}</button>
    <div class="langpick">${Object.entries(LANGS).map(([k,v])=>`<button data-tl="${k}" lang="${k}" aria-pressed="${k===LANG}">${v}</button>`).join("")}</div></div>`};
  draw();document.body.appendChild(el);
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();
    if(b.dataset.tl){S.lang=b.dataset.tl;applyLang(S.lang);save();draw();renderMute();renderTop();erasKey="";if(D)renderDig();return}
    if(b.id==="playBtn"){SFX.click();el.remove();const now=Date.now();statSession();if(!S.lastPlay||S.lastPlayDay!==today()||now-S.lastPlay>=45*60000){dqAdd("visits");S.lastPlay=now;S.lastPlayDay=today();save()}startGame()}});
}
function startGame(){
  if(!S.tutDone){startTut(false)}   // nicht nur beim allerersten Start: auch wer die App vorher schon einmal geöffnet hat
  else{showOffline();
    if(rescuable()&&S.rescueAsk!==today()){S.rescueAsk=today();save();
      const tryOpen=()=>{if(document.querySelector(".overlay")){setTimeout(tryOpen,700);return}showDQ()};setTimeout(tryOpen,500)}}
}

/* ================= Allgemein ================= */
function renderTop(){$("coins").textContent=Math.floor(S.coins);if($("tix"))$("tix").textContent=S.tix||0;{const ti=$("tixImg");if(ti&&!ti.src)ti.src=aurl("ticket.webp")}renderNavBadge();const r=rate();$("rate").textContent=r?t("rateTop",{r}):""}
let view="dig";
function show(v){setTimeout(()=>tutEvent("view:"+v),60);view=v;["dig","mus","lab","shop"].forEach(k=>{$("v-"+k).hidden=k!==v;$("t-"+k).setAttribute("aria-selected",k===v)});window.scrollTo(0,0);if(v==="mus")renderMus();if(v==="lab"){renderLab();setTimeout(()=>{try{maybeAskNotif()}catch(e){}},600)}if(v==="shop")renderShop();if(v==="dig"){sizePit();drawScene();renderDig()}}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.dataset.show=1;clearTimeout(tt);tt=setTimeout(()=>t.dataset.show=0,2000)}

function cellAt(ev){const r=pit.getBoundingClientRect();const x=Math.floor((ev.clientX-r.left)/(r.width/COLS)),y=Math.floor((ev.clientY-r.top)/(r.height/ROWS));return x>=0&&x<COLS&&y>=0&&y<ROWS?y*COLS+x:-1}
// Tippen = Finger auf dem Feld ablegen und ohne nennenswerte Bewegung loslassen. Wer zieht oder scrollt, löst nichts aus.
let tap=null;const TAP_MOVE=10;
pit.addEventListener("pointerdown",e=>{if(e.button>0)return;tap={id:e.pointerId,x:e.clientX,y:e.clientY,i:cellAt(e)}});
pit.addEventListener("pointermove",e=>{if(tap&&e.pointerId===tap.id&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>TAP_MOVE)tap=null});
pit.addEventListener("pointerup",e=>{const s=tap;tap=null;if(!s||e.pointerId!==s.id)return;
  if(Math.hypot(e.clientX-s.x,e.clientY-s.y)>TAP_MOVE)return;kc.on=false;if(s.i>=0)hit(s.i)});
["pointercancel","pointerleave"].forEach(n=>pit.addEventListener(n,()=>{tap=null}));
pit.addEventListener("keydown",e=>{const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
  if(mv){e.preventDefault();kc.on=true;kc.r=Math.max(0,Math.min(ROWS-1,kc.r+mv[0]));kc.c=Math.max(0,Math.min(COLS-1,kc.c+mv[1]))}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();kc.on=true;hit(kc.r*COLS+kc.c)}});

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.closest(".overlay"))return;
  if(b.dataset.tool!=="probe")SFX.click();
  if(b.id==="mute"){S.sound=!S.sound;save();renderMute();if(S.sound)SFX.click()}
  else if(b.id==="refill")showRewardedAd(t("plusEnergy"),()=>{S.st+=AD_STA;save();renderDig()});
  else if(b.dataset.rare)showRare(b.dataset.rare,true,0,true);
  else if(b.id==="openHall")openHall();
  else if(b.id==="expoAd")startExpo();
  else if(b.dataset.speed){const u=+b.dataset.speed;showRewardedAd(t("labAd"),()=>labSkip(u))}
  else if(b.dataset.rest){const[id,i]=b.dataset.rest.split("|"),c=CREATURES.find(k=>k.id===id);if(c)showRewardedAd(t("restAd"),()=>{if(S.lab.some(x=>x.id===id&&x.part===+i))return;addRest(id,+i,c.e);save();toast(t("restStart"));renderLab();renderNavBadge()})}
  else if(b.dataset.cskip){const u=+b.dataset.cskip,p=buyPrice();if(S.coins>=p){S.coins-=p;countBuy();stat("buyLab");SS().spent+=p;SFX.coin();labSkip(u)}}
  else if(b.id==="t-lab")show("lab");
  else if(b.id==="dqBtn")showDQ();
  else if(b.id==="report")showReport();
  else if(b.id==="tutReplay"){show("dig");startTut(true)}
  else if(b.id==="notifT"){notifEnable(!S.notif)}
  else if(b.dataset.lang){S.lang=b.dataset.lang;applyLang(S.lang);save();renderMute();renderTop();erasKey="";if(D)renderDig();show("shop")}
  else if(b.id==="probead")showRewardedAd(t("probeAd"),()=>{D.probes++;D.adProbe=true;tool="probe";renderDig()});
  else if(b.id==="t-dig")show("dig");else if(b.id==="t-mus")show("mus");else if(b.id==="t-shop")show("shop");
  else if(b.dataset.tool){tool=b.dataset.tool;renderDig();if(tool==="probe")tutEvent("probeSel")}
  else if(b.dataset.sp)spOffer(b.dataset.sp);
  else if(b.id==="siteBtn")openMap();
  else if(b.id==="again"){S.digs++;save();newDig()}
  else if(b.id==="quit"){stat("digsQuit");D.over=true;renderDig();showResult()}
  else if(b.dataset.up){const k=b.dataset.up,c=costs[k]();if(c&&S.coins>=c){S.coins-=c;SS().spent+=c;tickStamina(Date.now());S[k+"Lv"]=(S[k+"Lv"]||0)+1;statEv(({energy:"Feldflasche",regen:"Feldküche",bench:"Werkbank",prec:"Profi-Hacke",probe:"Bodensonde",camp:"Expeditionslager"}[k]||k)+" Stufe "+S[k+"Lv"]+" gekauft ("+c+" Münzen)");tickLab(Date.now());save();SFX.coin();renderShop();toast(t("upgraded"))}}
  else if(b.id==="reset"){const ov=overlay(`<h2>${t("resetQ")}</h2><p class="sub">${t("resetSub")}</p><div class="row"><button class="btn" id="rno">${t("keep")}</button><button class="btn primary" id="ryes">${t("del")}</button></div>`);
    ov.addEventListener("click",ev=>{const x=ev.target.closest("button");if(!x)return;ev.stopPropagation();ov.remove();if(x.id==="ryes"){{const lg=S.lang;S=blank();S.lang=lg}S.st=energyMax();S.stT=Date.now();S.fullDay=today();offline=0;D=null;save();renderMute();show("dig");toast(t("newGame"))}})}
  renderTop();
});

let lastShop=0;
setInterval(()=>{S.coins+=rate()/3600*(expoOn()?2:1);tickAll();renderTop();if(view==="shop"&&Date.now()-lastShop>2000){lastShop=Date.now();renderShop()}},1000);
setInterval(save,5000);
try{new ResizeObserver(()=>{sizePit();drawScene()}).observe(pit)}catch(e){addEventListener("resize",()=>{sizePit();drawScene()})}
if(document.fonts)document.fonts.ready.then(()=>{sizePit();drawScene()});
{const now=Date.now();QUIET=true;tickStamina(now);AWAY=tickLab(now);QUIET=false;
  if(S.fullDay!==today()){const first=!S.fullDay;S.fullDay=today();if(!first){S.st+=20;DAILY=true}}}
initSites();renderMute();renderTop();sizePit();drawScene();restoreDig()||newDig();renderNavBadge();preload();requestAnimationFrame(loop);showTitle();
</script>

<title>Fossiland</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: mobile game shell — header with coin pill, one "dig site" card (era landscape over a framed pit), tool tray, fixed bottom nav. Single warm earth theme by choice. */
:root{
  --bg:#2a1c13; --bg2:#33231a; --panel:#3e2b1f; --panel-hi:#4d3627; --edge:#1c120c; --line:#5f4431;
  --fg:#fff3e2; --muted:#cdb59c; --ghost:#8a6f58;
  --tape:#ff5a8a; --tape-dk:#c23663; --tape-ink:#3a0717;
  --amber:#ffb53d; --amber-dk:#c47c14;
  --bone:#f4e7c8; --bone-dk:#b89c6a;
  --good:#8be0a4; --good-dk:#3f9a5f;
  --plinth:#241810;
  --f-display:"Lilita One","Arial Rounded MT Bold","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;
  background:repeating-linear-gradient(180deg,var(--bg) 0 46px,var(--bg2) 46px 52px,var(--bg) 52px 120px,#2e1f15 120px 128px);
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:10px calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--tape);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--f-display);font-size:30px;line-height:1;margin:0;letter-spacing:.5px;color:var(--bone);text-shadow:0 3px 0 var(--edge)}
.logo span{color:var(--tape)}
.hdr-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:7px;background:var(--edge);border-radius:999px;padding:5px 12px 5px 5px;font-family:var(--f-display);font-size:18px;box-shadow:inset 0 -2px 0 rgba(255,255,255,.06)}
.coin{width:22px;height:22px;border-radius:50%;flex:none;background:url(assets/coin.webp) center/114% no-repeat,radial-gradient(circle at 35% 30%,#ffe3a1,var(--amber) 50%,var(--amber-dk))}
.coin.sm{width:16px;height:16px}
.pill small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--panel);box-shadow:0 3px 0 var(--edge);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn svg{width:20px;height:20px}

/* chunky game buttons */
.btn{font:700 15px var(--f-body);border:0;border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--panel-hi);color:var(--fg);box-shadow:0 4px 0 var(--edge);flex:1;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.primary{background:var(--tape);color:var(--tape-ink);box-shadow:0 4px 0 var(--tape-dk);font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.3px}
.btn.primary:active{box-shadow:0 1px 0 var(--tape-dk)}
.btn.ad{background:var(--amber);color:#3d2200;box-shadow:0 4px 0 var(--amber-dk)}
.btn.ad:active{box-shadow:0 1px 0 var(--amber-dk)}
.btn.ad::before{content:"";width:0;height:0;border-left:9px solid currentColor;border-top:6px solid transparent;border-bottom:6px solid transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}

/* dig site */
.site{border-radius:20px;overflow:hidden;background:var(--edge);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.scene{position:relative;height:150px}
.scene canvas{display:block;width:100%;height:100%}
.scene-ov{position:absolute;inset:0;padding:10px 12px;background:linear-gradient(180deg,rgba(20,12,8,.42),rgba(20,12,8,0) 55%);display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.era-t{font-family:var(--f-display);font-size:26px;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(0,0,0,.25)}
.era-s{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.trail{align-self:flex-start;background:rgba(28,18,12,.72);backdrop-filter:blur(4px);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--bone)}
.trail b{font-family:var(--f-display);font-weight:400;font-size:15px;color:#fff;margin-left:2px}
.pit{padding:20px 8px 8px 20px;background:linear-gradient(#6a4a2e,#4a301c);position:relative;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,230,190,.12)}
.pit .gl{position:absolute;display:grid;pointer-events:none;font:700 10.5px var(--f-body);color:rgba(255,236,205,.7);letter-spacing:.04em}
.pit .gl.top{left:20px;right:8px;top:3px;height:15px;grid-template-columns:repeat(8,1fr);text-align:center;align-items:center}
.pit .gl.side{top:20px;bottom:8px;left:2px;width:16px;grid-template-rows:repeat(9,1fr);text-align:center;align-items:center}
.pit .stake{position:absolute;width:9px;height:9px;border-radius:2px;background:linear-gradient(135deg,#c9a06a,#7a5430);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.pit canvas{display:block;width:100%;border-radius:4px;touch-action:manipulation;cursor:pointer}

.eras{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;margin-bottom:-6px;scrollbar-width:none}
.eras::-webkit-scrollbar{display:none}
.eras .era{flex:0 0 30%;scroll-snap-align:start;min-width:100px}
.era{border:0;border-radius:14px;padding:9px 6px 8px;cursor:pointer;background:var(--panel);box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;align-items:center;gap:1px}
.era b{font-family:var(--f-display);font-weight:400;font-size:17px}
.era small{font-size:11px;color:var(--muted);font-weight:700}
.era[aria-pressed="true"]{background:var(--bone);color:#3a2616;box-shadow:0 4px 0 var(--bone-dk)}
.era[aria-pressed="true"] small{color:#7a5a3a}
.era:disabled{opacity:.5;cursor:not-allowed}

.hud{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.energy{display:flex;align-items:center;gap:8px}
.energy svg{width:22px;height:22px;flex:none;color:var(--amber)}
.bar{flex:1;height:16px;border-radius:999px;background:var(--edge);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(180deg,#ffd27a,var(--amber) 60%,var(--amber-dk));transition:width .2s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font:700 11px var(--f-body);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6)}
.chip{display:flex;align-items:center;gap:6px;background:var(--edge);border-radius:999px;padding:5px 11px;font-family:var(--f-display);font-size:15px;white-space:nowrap}
.chip svg{width:18px;height:18px;color:var(--bone)}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tool{border:0;border-radius:18px;padding:10px 6px 9px;cursor:pointer;background:var(--panel);box-shadow:0 5px 0 var(--edge);display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .06s,box-shadow .06s;position:relative}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.tool svg{width:40px;height:40px}
.tool .ti{width:52px;height:52px;object-fit:contain;margin:-6px 0 -4px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.35))}
.tool b{font-family:var(--f-display);font-weight:400;font-size:16px}
.tool small{font-size:11px;color:var(--muted);line-height:1.2;text-align:center}
.tool[aria-pressed="true"]{background:var(--panel-hi);box-shadow:0 5px 0 var(--edge),inset 0 0 0 3px var(--tape)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.tool .badge{position:absolute;top:-6px;right:-4px;background:var(--tape);color:var(--tape-ink);font-family:var(--f-display);font-size:13px;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 0 var(--tape-dk)}
.tool.ad-t{background:var(--amber);color:#3d2200;box-shadow:0 5px 0 var(--amber-dk)}
.tool.ad-t small{color:#6b4300}
.hint{font-size:13px;color:var(--muted);margin:0;text-wrap:pretty}

/* bottom nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--edge);padding:8px max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));box-shadow:0 -6px 18px rgba(0,0,0,.35)}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{position:relative;border:0;background:transparent;border-radius:14px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ghost);font-weight:700;font-size:12px}
nav button svg{width:26px;height:26px}
nav button[aria-selected="true"]{color:var(--bone);background:var(--panel)}
nav button[aria-selected="true"] svg{color:var(--tape)}

/* museum */
.sec-h{font-family:var(--f-display);font-weight:400;font-size:20px;margin:6px 0 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700}
.mus{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--edge)}
.card.full{box-shadow:0 5px 0 var(--edge),inset 0 0 0 3px var(--good)}
.display{background:radial-gradient(ellipse at 50% 110%,#5a3e2a,var(--plinth) 70%);padding:10px 10px 0;position:relative}
.display svg,.display canvas{display:block;width:100%;height:auto;max-width:100%}
.card .body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .name{font-family:var(--f-display);font-size:21px;line-height:1.1}
.card p{margin:0;font-size:13px;color:var(--muted)}
.earn{display:flex;align-items:center;gap:5px;background:var(--good);color:#0f3a1d;border-radius:999px;padding:3px 10px 3px 4px;font-family:var(--f-display);font-size:14px;white-space:nowrap}
.cnt{font-family:var(--f-display);font-size:14px;color:var(--muted);white-space:nowrap}
.pips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.pip{font-size:10.5px;font-weight:700;text-align:center;padding:4px 2px;border-radius:8px;background:var(--edge);color:var(--ghost);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pip.ok{background:var(--bone);color:#3a2616}
.pip.cr{background:var(--bone-dk);color:#3a2616}
.pip.lab{background:transparent;box-shadow:inset 0 0 0 1.5px var(--amber);color:var(--amber)}
.nb{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--tape);color:var(--tape-ink);font:700 11px var(--f-body);display:grid;place-items:center;padding:0 5px}
.bench{display:grid;grid-template-columns:104px 1fr;gap:14px;align-items:center;background:var(--panel);border-radius:18px;padding:12px;box-shadow:0 5px 0 var(--edge)}
.bench>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.slabbox{position:relative;width:104px;height:104px;max-width:100%;border-radius:14px;background:radial-gradient(circle at 50% 55%,#5a3e2a,var(--edge) 75%);overflow:hidden}
.slabbox img{position:absolute;left:10px;top:10px;width:84px;height:84px;object-fit:contain}
.slabbox .rock{position:absolute;inset:0;background:url(assets/tiles.webp) no-repeat;background-size:900% 600%;transition:clip-path 1s linear}
.slabbox .rock::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,240,210,.35),transparent 18%)}
.bench b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.bench .meta{font-size:12.5px;color:var(--muted)}
.bench .bar{flex:none;height:18px}
.bench .btn{flex:none;align-self:flex-start;padding:8px 12px;font-size:13px}
.bench.free .slabbox,.bench.locked .slabbox{display:grid;place-items:center;color:var(--ghost);font-family:var(--f-display);font-size:30px}
.bench.locked{opacity:.6}
.queue{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.queue li{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:8px 12px;font-size:14px}
.queue li img,.queue li svg{width:30px;height:30px;object-fit:contain;flex:none}
.queue li span{flex:1;min-width:0}
.queue li em{font-style:normal;color:var(--muted);font-size:12.5px;white-space:nowrap}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bignum{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-display);font-size:40px}
.card.locked .display{height:70px;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:var(--ghost)}

/* workshop */
.up{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border-radius:18px;padding:12px;box-shadow:0 5px 0 var(--edge)}
.up .ic{width:52px;height:52px;border-radius:14px;background:var(--edge);display:grid;place-items:center}
.up .ic svg{width:36px;height:36px}
.up .ic .ti{width:50px;height:50px;object-fit:contain}
.finds li .ti{width:30px;height:30px;object-fit:contain;flex:none}
.up b{font-family:var(--f-display);font-weight:400;font-size:18px}
.up p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.lv{display:flex;gap:3px;margin-top:5px}
.lv i{width:12px;height:6px;border-radius:3px;background:var(--edge)}
.lv i.on{background:var(--good)}
.up .btn{flex:none;font-family:var(--f-display);font-weight:400;font-size:16px;padding:9px 12px}

/* overlays & toast */
.overlay{position:fixed;inset:0;background:rgba(14,9,6,.78);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));animation:fade .2s}
.modal{width:100%;max-width:440px;background:var(--panel);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 0 var(--edge);animation:rise .28s cubic-bezier(.2,1.3,.4,1)}
.modal h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;text-align:center;text-wrap:balance}
.modal .sub{text-align:center;color:var(--muted);font-size:13px;margin:-6px 0 0}
.finds{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;max-height:40vh;overflow:auto}
.finds li{display:flex;align-items:center;gap:10px;background:var(--edge);border-radius:12px;padding:7px 10px;font-size:14px}
.finds li svg{width:26px;height:26px;flex:none}
.finds li span{flex:1;min-width:0}
.finds li em{font-style:normal;font-family:var(--f-display);font-size:15px;color:var(--amber);white-space:nowrap}
.finds li em.bad{color:var(--bone-dk)}
.finds li em.ok{color:var(--good)}
.adleft{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700}
.adscreen{aspect-ratio:16/9;max-width:100%;border-radius:14px;background:repeating-linear-gradient(135deg,#4a3324 0 16px,#3f2b1e 16px 32px);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);position:relative;overflow:hidden}
.adscreen b{font-family:var(--f-display);font-weight:400;font-size:52px;color:var(--fg);line-height:1}
.adbar{position:absolute;left:0;bottom:0;height:6px;background:var(--amber);width:0}
/* start screen */
.title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:14px;text-align:center;background:url(assets/keyart.webp) center 70%/cover no-repeat,var(--bg);padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.title::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(42,28,19,.28) 0%,rgba(42,28,19,0) 26%,rgba(42,28,19,0) 62%,rgba(42,28,19,.82) 86%,rgba(42,28,19,.95) 100%)}
.title .ttop,.title .tbot{display:flex;flex-direction:column;align-items:center;gap:10px}
.title .ttop{margin-top:4vh}
.title>*{position:relative}
.title .hero{width:min(94vw,460px);max-width:100%;aspect-ratio:190/96;background:url(assets/sk_trex.webp) center/contain no-repeat;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));animation:float 5s ease-in-out infinite;margin-bottom:-6px}
.title h1{font-family:var(--f-display);font-weight:400;font-size:clamp(54px,17vw,84px);line-height:.9;margin:0;color:var(--bone);letter-spacing:1px;text-shadow:0 5px 0 var(--edge),0 12px 30px rgba(0,0,0,.55)}
.title h1 span{color:var(--tape)}
.title .tagline{margin:0;font-weight:700;color:var(--bone);font-size:15px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.title .btn.primary{flex:none;min-width:min(240px,80vw);font-size:26px;padding:14px 30px;margin-top:10px}
.langpick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.langpick button{border:0;border-radius:999px;padding:7px 13px;background:rgba(28,18,12,.75);color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.langpick button[aria-pressed="true"]{background:var(--bone);color:#3a2616}
@keyframes float{50%{transform:translateY(-9px)}}
/* tutorial */
.coach-spot{position:fixed;z-index:35;border-radius:18px;pointer-events:none;box-shadow:0 0 0 9999px rgba(14,9,6,.6);transition:left .25s,top .25s,width .25s,height .25s}
.coach-spot.ring{box-shadow:0 0 0 9999px rgba(14,9,6,.6),inset 0 0 0 3px var(--tape);animation:ring 1.4s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 9999px rgba(14,9,6,.6),inset 0 0 0 5px var(--amber)}}
.coach{position:fixed;left:50%;transform:translateX(-50%);z-index:36;width:min(440px,calc(100% - 24px));background:var(--bone);color:#2a1a0e;border-radius:20px;padding:14px 16px 12px;box-shadow:0 6px 0 var(--bone-dk),0 12px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px}
.coach b{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.1}
.coach p{margin:0;font-size:14.5px;line-height:1.42}
.coach .crow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.coach .dots{display:flex;gap:4px}
.coach .dots i{width:7px;height:7px;border-radius:50%;background:#d6c39c}
.coach .dots i.on{background:var(--tape)}
.coach .skip{border:0;background:transparent;color:#7a5a3a;font-weight:700;font-size:13px;cursor:pointer;padding:6px 4px}
.coach .btn{flex:none;padding:9px 18px}
.iconbtn{position:relative}
.iconbtn .nb{top:-6px;left:auto;right:-6px}
.dq{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.dq li{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;background:var(--edge);border-radius:14px;padding:9px 10px}
.dq li .mi{width:38px;height:38px;display:grid;place-items:center}
.dq li .mi img,.dq li .mi svg{width:36px;height:36px;object-fit:contain}
.dq li>div{min-width:0}
.dq li b{display:block;font-size:14px;line-height:1.25}
.dq li small{display:block;color:var(--muted);font-size:11.5px}
.dq .bar{height:14px;margin-top:6px}
.dq .side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.dq .rw{display:flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:15px;color:var(--amber);white-space:nowrap}
.dq .btn{flex:none;padding:7px 12px;font-size:13px}
.dq li.got{opacity:.55}
.dq .ok{font-weight:700;font-size:12.5px;color:var(--good)}
.streak{display:flex;gap:6px;justify-content:center}
.streak i{width:32px;height:32px;border-radius:50%;background:var(--edge);display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:14px;color:var(--ghost)}
.streak i.on{background:var(--amber);color:#3d2200}

.banner h2{position:relative;margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.banner small{display:block;font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--bone)}
.coach{padding-left:104px!important;min-height:120px;box-sizing:border-box}
.coach .guide{position:absolute;left:-4px;bottom:0;width:104px;height:auto;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.modal .guide-top{display:block;width:110px;height:auto;margin:-4px auto -8px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,0);background:var(--bone);color:#2a1a0e;padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center;z-index:50;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 4px 0 var(--bone-dk)}
.toast[data-show="0"]{opacity:0;transform:translate(-50%,-12px)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:0}}

  m[x.part]=x.cr?"cr":"ok";
  x.msg=t("prepared",{pn:pname(c,x.part),n:c.n});

/* ================= Belohnungs-Werbung =================
   In der Android-App: echte AdMob-Videos (zurzeit Googles Test-Anzeigen).
   Im Browser und in der HTML-Datei: Platzhalter mit 5-Sekunden-Video.
   Für den Store nur AD_UNIT (und die App-ID in strings.xml) gegen die eigenen IDs tauschen und ADS_TESTING auf false setzen. */
const AD_UNIT="ca-app-pub-3940256099942544/5224354917";   // Googles Test-ID für Belohnungsvideos
const ADS_TESTING=true;
const ADM=(()=>{try{return window.capacitorExports&&capacitorExports.Capacitor.isNativePlatform()&&window.capacitorStripe&&capacitorStripe.AdMob?capacitorStripe.AdMob:null}catch(e){return null}})();
const ADQ={init:null,ready:false,loading:null,earned:false,done:null};
function admInit(){if(!ADM)return Promise.resolve(false);if(ADQ.init)return ADQ.init;
  ADQ.init=(async()=>{try{
    await ADM.initialize({initializeForTesting:ADS_TESTING,tagForChildDirectedTreatment:true,tagForUnderAgeOfConsent:true,maxAdContentRating:"General"});
    ADM.addListener("onRewardedVideoAdReward",()=>{ADQ.earned=true});
    ADM.addListener("onRewardedVideoAdDismissed",()=>{const f=ADQ.done;ADQ.done=null;ADQ.ready=false;if(f)f(ADQ.earned);admLoad()});
    ADM.addListener("onRewardedVideoAdFailedToShow",()=>{const f=ADQ.done;ADQ.done=null;ADQ.ready=false;if(f)f(null);admLoad()});
    admLoad();return true}catch(e){return false}})();
  return ADQ.init}
function admLoad(){if(!ADM||ADQ.ready)return Promise.resolve(ADQ.ready);if(ADQ.loading)return ADQ.loading;
  ADQ.loading=ADM.prepareRewardVideoAd({adId:AD_UNIT,isTesting:ADS_TESTING}).then(()=>{ADQ.ready=true;return true},()=>false).finally(()=>{ADQ.loading=null});
  return ADQ.loading}
function adReward(label,onReward){S.adCount++;stat("ads");stat("ad:"+adKind(label));statDay().a=(statDay().a||0)+1;save();SFX.coin();onReward();renderTop()}
async function showNativeAd(label,onReward){
  const ov=overlay(`<h2>${label}</h2><p class="sub">${t("adLoading")}</p><button class="btn" id="adcancel">${t("cancel")}</button>`);ov.style.zIndex=25;
  let gone=false;ov.addEventListener("click",e=>{if(e.target.closest("#adcancel")){e.stopPropagation();gone=true;ov.remove();stat("adCancel")}});
  await admInit();const ok=ADQ.ready||await admLoad();if(gone)return;ov.remove();
  if(!ok){stat("adFail");save();toast(t("adNone"));admLoad();return}
  ADQ.earned=false;const res=new Promise(r=>{ADQ.done=r});
  ADM.showRewardVideoAd().catch(()=>{});const earned=await res;
  if(earned===null){stat("adFail");save();toast(t("adNone"));return}
  if(earned)adReward(label,onReward);else{stat("adCancel");save();toast(t("noReward"))}}
if(ADM)setTimeout(admInit,1500);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function adsLeft(){if(S.adDay!==today()){S.adDay=today();S.adCount=0}return AD_LIMIT-S.adCount}
function overlay(html){const ov=document.createElement("div");ov.className="overlay";ov.innerHTML=`<div class="modal" role="dialog">${html}</div>`;document.body.appendChild(ov);return ov}
function showRewardedAd(label,onReward){
  if(adsLeft()<=0){toast(t("noVideos"));return}
  if(ADM){showNativeAd(label,onReward);return}
  const ov=overlay(`<div class="adscreen"><div><b id="adn">5</b><br>${t("adPh")}</div><div class="adbar" id="adbar"></div></div><h2>${label}</h2><p class="sub" id="adtxt">${t("adWatch")}</p><button class="btn primary" id="adclaim" disabled>${t("claim")}</button><button class="btn" id="adcancel">${t("cancel")}</button>`);
  ov.style.zIndex=25;
  let n=5;const bar=ov.querySelector("#adbar");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition="width 5s linear";bar.style.width="100%"}));
  const iv=setInterval(()=>{n--;ov.querySelector("#adn").textContent=Math.max(n,0);if(n<=0){clearInterval(iv);ov.querySelector("#adclaim").disabled=false;ov.querySelector("#adtxt").textContent=t("adDone")}},1000);
  ov.addEventListener("click",e=>{e.stopPropagation();const id=e.target.closest("button")?.id;
    if(id==="adcancel"){stat("adCancel");clearInterval(iv);ov.remove();SFX.click();toast(t("noReward"))}
    if(id==="adclaim"){ov.remove();adReward(label,onReward)}});
}

const SCENES=[
  {sky:["#b8584a","#f0b98a"],sun:["#ffe0b0",.72,.34,18],hills:["#b35a40","#8e4130","#62291e"],ground:"#5a2a1e",plant:"conifer",grass:"#a87a3e"},
  {sky:["#f3a85c","#fbe2ae"],sun:["#fff3c9",.78,.32,20],hills:["#d0814c","#b0603a","#8a4428"],ground:"#7a4a2a",plant:"cycad",grass:"#b98a3e"},
  {sky:["#6ec3d4","#dff4e6"],sun:["#fffbe0",.18,.28,16],hills:["#79b46b","#4f8c4e","#336a3c"],ground:"#4a3524",plant:"conifer",grass:"#5e9a4c",sauropod:1},
  {sky:["#e8735a","#f8c27c"],sun:["#ffe9b0",.62,.62,26],hills:["#9a5c55","#71403d","#4b2a28"],ground:"#3e2a1e",plant:"palm",grass:"#7a8a3e",volcano:1},
  {sky:["#7fcabf","#eaf7dc"],sun:["#fffbe0",.85,.25,15],hills:["#5aa35e","#3a8148","#245a36"],ground:"#3a2a1c",plant:"tree",grass:"#4f9a46",lake:1},
  {sky:["#8fb8d6","#eef5f8"],sun:["#ffffff",.22,.3,14],hills:["#f2f7fa","#d4e4ec","#a9c4d3"],ground:"#6a5a4a",plant:"spruce",grass:"#e8f2f6",glacier:1,mammoth:1}
];
function hillPath(ctx,w,h,base,amp,r){ctx.beginPath();ctx.moveTo(0,h);const a=r()*6,b=r()*6,f1=1.5+r()*2,f2=4+r()*3;for(let x=0;x<=w;x+=4){const t=x/w;ctx.lineTo(x,base+Math.sin(t*f1*Math.PI+a)*amp+Math.sin(t*f2*Math.PI+b)*amp*.35)}ctx.lineTo(w,h);ctx.closePath()}
function drawScene(){
  const c=$("scene"),w=c.clientWidth,h=c.clientHeight;if(!w)return;const d=devicePixelRatio||1;
  c.width=w*d;c.height=h*d;const ctx=c.getContext("2d");ctx.setTransform(d,0,0,d,0,0);
  const si=IMG[`scene_${S.era}.webp`];
  if(si&&si.naturalWidth){const iw=si.naturalWidth,ih=si.naturalHeight,cr=w/h;let sw=iw,sh=ih,sx=0,sy=0;
    if(cr>iw/ih){sh=iw/cr;sy=(ih-sh)*.55}else{sw=ih*cr;sx=(iw-sw)/2}ctx.drawImage(si,sx,sy,sw,sh,0,0,w,h);return}
  loadImg(`scene_${S.era}.webp`).then(im=>{if(im)drawScene()});
  const E=SCENES[S.era],r=mulberry(7+S.era*31);
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,E.sky[0]);g.addColorStop(1,E.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const [sc,sx,sy,sr]=E.sun;const sg=ctx.createRadialGradient(w*sx,h*sy,0,w*sx,h*sy,sr*3);sg.addColorStop(0,sc);sg.addColorStop(.3,sc+"cc");sg.addColorStop(1,sc+"00");ctx.fillStyle=sg;ctx.beginPath();ctx.arc(w*sx,h*sy,sr*3,0,7);ctx.fill();ctx.fillStyle=sc;ctx.beginPath();ctx.arc(w*sx,h*sy,sr,0,7);ctx.fill();
  if(E.volcano){const vx=w*.28;ctx.fillStyle="#6a3a3a";ctx.beginPath();ctx.moveTo(vx-90,h);ctx.lineTo(vx-14,h*.3);ctx.lineTo(vx+14,h*.3);ctx.lineTo(vx+90,h);ctx.fill();ctx.fillStyle="#ff8a3d";ctx.beginPath();ctx.moveTo(vx-14,h*.3);ctx.lineTo(vx+14,h*.3);ctx.lineTo(vx+8,h*.38);ctx.lineTo(vx-6,h*.42);ctx.fill();
    ctx.fillStyle="rgba(90,70,70,.55)";[[0,-8,10],[6,-20,13],[16,-34,16],[30,-46,18]].forEach(([dx,dy,rr])=>{ctx.beginPath();ctx.arc(vx+dx,h*.3+dy,rr,0,7);ctx.fill()})}
  if(E.glacier){[[.12,.22,70],[.42,.12,90],[.78,.28,60]].forEach(([fx,fy,bw])=>{const x=w*fx;ctx.fillStyle="#b9cfdc";ctx.beginPath();ctx.moveTo(x-bw,h*.7);ctx.lineTo(x,h*fy);ctx.lineTo(x+bw,h*.7);ctx.fill();ctx.fillStyle="#ffffff";ctx.beginPath();ctx.moveTo(x-bw*.3,h*fy+(h*.7-h*fy)*.3);ctx.lineTo(x,h*fy);ctx.lineTo(x+bw*.3,h*fy+(h*.7-h*fy)*.3);ctx.lineTo(x+bw*.1,h*fy+(h*.7-h*fy)*.38);ctx.lineTo(x-bw*.1,h*fy+(h*.7-h*fy)*.28);ctx.fill()})}
  E.hills.forEach((col,i)=>{ctx.fillStyle=col;hillPath(ctx,w,h,h*(.5+i*.14),8-i*1.5,r);ctx.fill();
    if(i===0&&E.lake){ctx.fillStyle="rgba(70,140,150,.85)";ctx.beginPath();ctx.ellipse(w*.62,h*.8,w*.22,8,0,0,7);ctx.fill();ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(w*.55,h*.8);ctx.lineTo(w*.62,h*.8);ctx.moveTo(w*.66,h*.82);ctx.lineTo(w*.72,h*.82);ctx.stroke()}
    if(i===1)for(let k=0;k<5;k++){const x=r()*w,y=h*(.62+r()*.08);plant(ctx,x,y,E.plant,r)}});
  ctx.lineCap="round";
  if(E.sauropod){const x=w*.7,y=h*.6,cl="#2c5a35";ctx.fillStyle=cl;ctx.strokeStyle=cl;ctx.beginPath();ctx.ellipse(x,y,22,9,0,0,7);ctx.fill();ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+16,y-3);ctx.quadraticCurveTo(x+30,y-12,x+32,y-30);ctx.stroke();ctx.beginPath();ctx.ellipse(x+34,y-31,5,3,0,0,7);ctx.fill();ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-20,y);ctx.quadraticCurveTo(x-36,y+2,x-46,y+8);ctx.stroke();ctx.lineWidth=4.5;[-12,-4,8,14].forEach(dx=>{ctx.beginPath();ctx.moveTo(x+dx,y+4);ctx.lineTo(x+dx,y+16);ctx.stroke()})}
  if(E.mammoth){const x=w*.68,y=h*.66,cl="#6f7f8c";ctx.fillStyle=cl;ctx.strokeStyle=cl;ctx.beginPath();ctx.ellipse(x,y,17,12,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+14,y-8,8,0,7);ctx.fill();ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(x+20,y-4);ctx.quadraticCurveTo(x+24,y+8,x+20,y+14);ctx.stroke();ctx.strokeStyle="#f3efe4";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+17,y);ctx.quadraticCurveTo(x+30,y+6,x+28,y-4);ctx.stroke();ctx.strokeStyle=cl;ctx.lineWidth=5;[-10,-3,6,12].forEach(dx=>{ctx.beginPath();ctx.moveTo(x+dx,y+6);ctx.lineTo(x+dx,y+17);ctx.stroke()})}
  ctx.fillStyle=E.ground;ctx.fillRect(0,h-10,w,10);
  ctx.strokeStyle=E.grass;ctx.lineWidth=2;
  for(let x=2;x<w;x+=5){const hh=4+r()*7;ctx.beginPath();ctx.moveTo(x,h-9);ctx.lineTo(x+(r()-.5)*4,h-9-hh);ctx.stroke()}
  if(S.era===5){ctx.fillStyle="rgba(255,255,255,.85)";for(let k=0;k<40;k++){ctx.beginPath();ctx.arc(r()*w,r()*h*.85,.8+r()*1.6,0,7);ctx.fill()}}
}
function plant(ctx,x,y,type,r){
  ctx.save();ctx.translate(x,y);const dk="rgba(0,0,0,.28)";ctx.lineCap="round";
  if(type==="cycad"){ctx.fillStyle=dk;ctx.fillRect(-2,-10,4,12);ctx.strokeStyle=dk;ctx.lineWidth=2.5;for(let a=-2.6;a<=-.5;a+=.42){ctx.beginPath();ctx.moveTo(0,-10);ctx.quadraticCurveTo(Math.cos(a)*10,-10+Math.sin(a)*12,Math.cos(a)*15,-6+Math.sin(a)*8);ctx.stroke()}}
  else if(type==="conifer"||type==="spruce"){const s=.8+r()*.6;ctx.fillStyle=type==="spruce"?"#2f4a45":dk;ctx.fillRect(-1.5,-6*s,3,8*s);for(let k=0;k<3;k++){ctx.fillStyle=type==="spruce"?"#2f4a45":dk;ctx.beginPath();ctx.moveTo(-9*s+k*2*s,-6*s-k*8*s);ctx.lineTo(0,-20*s-k*8*s);ctx.lineTo(9*s-k*2*s,-6*s-k*8*s);ctx.fill();if(type==="spruce"){ctx.fillStyle="#ffffff";ctx.beginPath();ctx.moveTo(-4*s+k*1*s,-13*s-k*8*s);ctx.lineTo(0,-20*s-k*8*s);ctx.lineTo(4*s-k*1*s,-13*s-k*8*s);ctx.fill()}}}
  else if(type==="tree"){const s=.8+r()*.5;ctx.fillStyle=dk;ctx.fillRect(-2,-14*s,4,16*s);[[0,-22,11],[-8,-17,8],[8,-17,8]].forEach(([dx,dy,rr])=>{ctx.beginPath();ctx.arc(dx*s,dy*s,rr*s,0,7);ctx.fill()})}
  else{ctx.strokeStyle=dk;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,2);ctx.quadraticCurveTo(4,-12,2,-26);ctx.stroke();ctx.lineWidth=2.5;for(let a=0;a<6;a++){const an=-Math.PI+a*Math.PI/5;ctx.beginPath();ctx.moveTo(2,-26);ctx.quadraticCurveTo(2+Math.cos(an)*10,-34,2+Math.cos(an)*16,-18);ctx.stroke()}}
  ctx.restore();

/* ================= Grabung ================= */

  const target=pool.length?pool[rnd(pool.length)]:all[rnd(all.length)];
  const r=mulberry(Date.now()&0xffff);
  const grid=[];
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const L=y<3?0:y<6?1:2,hp=L+1+(Math.random()<.45?1:0)+(L===2&&Math.random()<S.era*.09?1:0);
    const peb=[];for(let k=0;k<3+Math.floor(r()*3);k++)peb.push([r(),r(),.04+r()*.07,r()]);
    const cr=[];for(let k=0;k<4;k++)cr.push([r(),r(),r()*6.28,.2+r()*.25]);
    grid.push({r:y,c:x,L,hp,max:hp,v:Math.random()<.5?0:1,obj:null,crack:false,probe:false,peb,cr});
  }
  const at=(y,x)=>grid[y*COLS+x],objs=[];
  const missing=PARTS.map((p,i)=>i).filter(i=>!mus(target.id)[i]&&!labHas(target.id,i));
  const parts=(missing.length?missing:[0,1,2,3,4]).sort(()=>Math.random()-.5).slice(0,2+(Math.random()<.35?1:0));
  const place=(shape,obj)=>{for(let t=0;t<300;t++){const easy=FIRST&&!S.tutDone&&t===0&&obj.kind==="bone"&&!objs.length,r0=easy?3:1+rnd(ROWS),c0=easy?3:rnd(COLS);const cells=shape.map(([dr,dc])=>[r0+dr,c0+dc]);
    if(cells.every(([y,x])=>y<ROWS&&x<COLS&&!at(y,x).obj)){cells.forEach(([y,x])=>at(y,x).obj=obj);obj.cells=cells;objs.push(obj);return}}};
  parts.forEach(i=>place(PARTS[i].shape,{kind:"bone",part:i,found:false}));

function cellXY(g){return[g.c*cs,g.r*cs]}
function burst(g,n,col,speed=1){const[x,y]=cellXY(g);for(let i=0;i<n;i++)particles.push({x:x+cs/2+(Math.random()-.5)*cs*.6,y:y+cs/2+(Math.random()-.5)*cs*.4,vx:(Math.random()-.5)*3*speed,vy:(-Math.random()*3-1)*speed,life:1,col,s:2+Math.random()*3.5,g:.25,t:"d"})}

function hit(i){
  if(!D||D.over)return;
  const g=D.grid[i];
  if(tool==="probe"){
    if(D.probes<=0)return;D.probes--;SFX.probe();tutEvent("probe");dqAdd("probes");
    particles.push({x:(g.c+.5)*cs,y:(g.r+.5)*cs,life:1,t:"ring",vx:0,vy:0,g:0,s:0,col:"#ff5a8a"});
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const y=g.r+dr,x=g.c+dc;if(y>=0&&y<ROWS&&x>=0&&x<COLS){const q=D.grid[y*COLS+x];if(q.obj&&q.hp>0)q.probe=true}}

  }
  if(g.hp<=0)return;
  if(S.st<1){SFX.empty();showEmpty();return}
  if(S.st>=staMax())S.stT=Date.now();
  S.st--;
  const dmg=tool==="pick"?2:1,col=LAY()[g.L][0];
  if(tool==="pick"){SFX.pick(g.r);buzz(15);shake=5;burst(g,9,col,1.3)}else{SFX.brush();burst(g,4,col,.7)}
  if(tool==="pick"&&g.obj&&g.obj.kind==="bone"&&dmg>g.hp&&Math.random()<crackChance()){g.crack=true;SFX.crack();buzz([30,30,30]);toast(t("crack"))}
  g.hp=Math.max(0,g.hp-dmg);
  if(g.hp===0){burst(g,8,LAY()[g.L][1],1);if(!g.obj)SFX.clear();dqAdd("cells")}
  if(g.hp===0&&g.obj&&!g.obj.found){
    const o=g.obj;
    if(o.cells.every(([y,x])=>D.grid[y*COLS+x].hp===0)){
      o.found=true;o.foundAt=performance.now();
      if(o.kind==="relic"){const rn=(RELICS.find(r=>r[2]===o.ic)||[o.name])[0];S.coins+=o.val;D.earned+=o.val;SFX.relic();sparkle(o.cells,"#ffd27a");D.finds.push([ICP[o.ic],rn,`+${o.val}`,""]);toast(t("relicFound",{n:rn,v:o.val}));dqAdd("relics")}
      else{
        sparkle(o.cells);
        const cracked=o.cells.some(([y,x])=>D.grid[y*COLS+x].crack);dqAdd("bones");if(!cracked)dqAdd("intact");
        const m=mus(D.target.id),prev=m[o.part],pn=pname(D.target,o.part),em=eraMult(D.era);
        const rank=v=>v==="ok"||v===false?2:v==="cr"||v===true?1:0;
        const inLab=S.lab.find(x=>x.id===D.target.id&&x.part===o.part);
        const best=Math.max(rank(prev),inLab?rank(inLab.cr):0),nw=cracked?1:2;
        if(nw>best){
          if(inLab){inLab.cr=false}else addToLab(D.target.id,o.part,cracked,D.era);setTimeout(()=>tutEvent("bone"),700);
          D.finds.push([pic(SPR[o.part],IC.bone),`${pn} · ${D.target.n}`,t("toLab"),cracked?"bad":"ok",1]);
          SFX.bone();buzz(40);toast(t("boneFound",{pn,d:cracked?t("damaged"):""}));renderNavBadge()}
        else{const v=Math.round(3*em);S.coins+=v;D.earned+=v;SFX.bone();D.finds.push([IC.bone,t("dupe",{pn}),`+${v}`,""]);toast(t("dupeToast",{v}))}
      }
      save();
    }
  }
  if(D.objs.every(o=>o.found)){D.over=true;dqAdd("digs");setTimeout(showResult,900)}
  else if(S.st<1)setTimeout(showEmpty,400);
  renderDig();
}

  const rb=st(2);for(let x=P.ribs[0];x<=P.ribs[1];x+=5.5){const y=yAt(P.spine,x),t=(x-P.ribs[0])/(P.ribs[1]-P.ribs[0]),l=(c.p==="fish"?8:10)+Math.sin(t*Math.PI)*(c.p==="fish"?7:10),d=`M${x.toFixed(1)} ${y.toFixed(1)}q5 ${(l*.5).toFixed(1)} -1 ${l.toFixed(1)}`;

let skObs=null;const SKC={};
function hydrateSkels(){
  const els=[...document.querySelectorAll(".display[data-sk]")];
  if(!("IntersectionObserver" in window)){els.forEach(paintSkel);return}
  if(skObs)skObs.disconnect();
  skObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){skObs.unobserve(e.target);paintSkel(e.target)}}),{rootMargin:"600px 0px"});
  els.forEach(el=>skObs.observe(el));
}
async function paintSkel(el){
  const c=CREATURES.find(k=>k.id===el.dataset.sk);if(!c)return;
  const m=mus(c.id),key=LANG+c.id+":"+[0,1,2,3,4].map(i=>m[i]||"-").join("");
  let cv=SKC[key];
  if(!cv){
    const[a,b]=await Promise.all([loadImg(`sk_${c.id}.webp`),loadImg(`sk_${c.id}_m.png`)]);if(!a||!b)return;
    const w=a.naturalWidth,h=a.naturalHeight;cv=document.createElement("canvas");cv.width=w;cv.height=h;
    const x=cv.getContext("2d",{willReadFrequently:true});
    try{
      x.drawImage(b,0,0,w,h);const md=x.getImageData(0,0,w,h).data;x.clearRect(0,0,w,h);x.drawImage(a,0,0);
      const id=x.getImageData(0,0,w,h),d=id.data,st=[null,m[0],m[1],m[2],m[3],m[4],"ok"];
      for(let i=0;i<d.length;i+=4){const p=(md[i]+20)/40|0;if(!p||p>6)continue;const q=st[p];if(q==="ok")continue;
        if(q==="cr"){d[i]*=.8;d[i+1]*=.66;d[i+2]*=.5;continue}
        const l=(d[i]+d[i+1]+d[i+2])/765;d[i]=255;d[i+1]=238;d[i+2]=214;d[i+3]=d[i+3]*(.06+l*.1)}
      x.putImageData(id,0,0);
    }catch(e){return}
    cv.setAttribute("role","img");cv.setAttribute("aria-label",t("skeleton",{n:c.n}));
    SKC[key]=cv;
  }
  if(el.isConnected)el.replaceChildren(cv);
}

const QUIET_FROM=21*60,QUIET_TO=7*60+30;   // Nachtruhe in Minuten seit Mitternacht
function outOfQuiet(ts){const d=new Date(ts),m=d.getHours()*60+d.getMinutes();
  if(m>=QUIET_FROM){d.setDate(d.getDate()+1);d.setHours(7,30,0,0);return d.getTime()}
  if(m<QUIET_TO){d.setHours(7,30,0,0);return d.getTime()}return ts}
function labTimeline(now){const L=S.lab.map(x=>({...x})),out=[],slots=labSlots();let g=0;
  while(g++<300){const act=L.filter(x=>x.st!=null).sort((a,b)=>(a.st+a.dur)-(b.st+b.dur));
    if(act.length<slots){const w=L.find(x=>x.st==null);if(w){w.st=now;continue}}
    const f=act[0];if(!f)break;const tt=f.st+f.dur;out.push({t:tt,x:f});L.splice(L.indexOf(f),1);const w=L.find(x=>x.st==null);if(w)w.st=tt}
  return out}
function notifPlan(now){const list=[];
  // Labor: Funde, die nah beieinander fertig werden, landen in einer Nachricht
  const groups=[];for(const e of labTimeline(now)){const t2=outOfQuiet(e.t);const g=groups[groups.length-1];
    if(g&&t2-g.t<=10*60000){g.items.push(e.x);g.t=Math.max(g.t,t2)}else groups.push({t:t2,items:[e.x]})}
  groups.slice(0,6).forEach((g,i)=>{const x=g.items[0],c=CREATURES.find(k=>k.id===x.id);
    list.push({id:100+i,at:g.t,title:t("nLabT"),body:g.items.length>1||!c?t("nLabK",{k:g.items.length}):t("nLab1",{pn:LANG==="de"?pname(c,x.part):pname(c,x.part).toLowerCase(),n:c.n})})});
  // Energie voll, wenn das mehr als 10 Minuten dauert
  const fi=fullIn(now);if(fi>10*60000)list.push({id:200,at:outOfQuiet(now+fi),title:t("nStaT"),body:t("nStaB")});
  // Serie: um 18 Uhr erinnern, wenn die Tagestruhe heute noch fehlt
  const sn=streakNow();if(sn>=2&&S.streak.last!==today()){const d=new Date(now);d.setHours(18,0,0,0);if(d.getTime()>now+15*60000)list.push({id:300,at:d.getTime(),title:t("nStrT"),body:t("nStrB",{n:sn})})}
  return list}

    days:Object.fromEntries(Object.entries(x.days).map(([k,v])=>[k,[v.s||0,v.sec||0,v.a||0]])),
    ads:c.ads||0,adCancel:c.adCancel||0,adFail:c.adFail||0,adKinds:Object.fromEntries(Object.keys(c).filter(k=>k.startsWith("ad:")).map(k=>[k.slice(3),c[k]])),
    done:completed(),eras:ERAS.filter((e,i)=>unlocked(i)).length,digs:c.digsStarted||0,bones:c.bones||0,streak:x.maxStreak||0,tut:x.tut||""};
  return btoa(unescape(encodeURIComponent(JSON.stringify(d))))}
const SHR=(()=>{try{return window.capacitorExports&&capacitorExports.Capacitor.isNativePlatform()&&window.capacitorShare?capacitorShare.Share:null}catch(e){return null}})();
function showReport(){
  const x=SS();
  const ov=overlay(`<h2>${t("reportT")}</h2><p class="sub">${t("reportSub")}</p>
    <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)">${t("tName")}<input id="repName" maxlength="24" placeholder="${t("tNamePh")}" style="font:15px var(--f-body);padding:10px 12px;border:0;border-radius:12px;background:var(--edge);color:var(--fg)"></label>
    <textarea class="report" id="repTxt" readonly></textarea>
    <div class="row"><button class="btn" id="repClose">${t("close")}</button><button class="btn" id="repCopy">${t("copy")}</button><button class="btn primary" id="repShare">${t("share")}</button></div>`);
  const ta=ov.querySelector("#repTxt"),nm=ov.querySelector("#repName");nm.value=x.name||"";ta.value=reportText();
  nm.addEventListener("input",()=>{x.name=nm.value.trim().slice(0,24);save();ta.value=reportText()});
  const copy=txt=>{const fb=()=>{ta.focus();ta.select();toast(t("copyFail"))};try{navigator.clipboard.writeText(txt).then(()=>{SFX.coin();toast(t("copied"))},fb)}catch(err){fb()}};
  ov.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();const txt=reportText();ta.value=txt;
    if(b.id==="repClose"){ov.remove();return}
    if(b.id==="repCopy"){copy(txt);return}
    if(b.id==="repShare"){const title="Fossiland Testbericht "+(x.name||x.id);
      try{if(SHR){await SHR.share({title,text:txt,dialogTitle:t("share")});return}
        if(navigator.share){await navigator.share({title,text:txt});return}}catch(err){if(err&&/cancel|abort/i.test(String(err.message||err.name)))return}
      copy(txt)}});
}

/* ================= Startbildschirm & Anleitung ================= */
// Posen der Paläontologin: wave (Standard), point, think, lab, wow, cheer
const gpose=(g,full)=>g&&g!=="wave"?`guide_${g}${full?"":"_bust"}.webp`:(full?"guide.webp":"guide_bust.webp");
const TUT=[
  {k:"t1",sel:null},
  {k:"t2",sel:'[data-tool="probe"]',wait:"probeSel",skipIf:()=>!D||D.probes<1,g:"point"},
  {k:"t3",sel:"#pit",wait:"probe",skipIf:()=>!D||D.probes<1&&tool!=="probe",g:"think"},
  {k:"t4",sel:"#pit",wait:"bone",g:"point"},
  {k:"t5",sel:"#t-lab",wait:"view:lab",x:"navLab",g:"point"},
  {k:"t6",sel:".bench",g:"lab"},
  {k:"t7",sel:"#t-mus",wait:"view:mus",x:"navMus",g:"point"},
  {k:"t8",sel:"#v-mus .card",g:"wow"},
  {k:"t9",sel:"#t-shop",wait:"view:shop",x:"navShop",g:"point"},
  {k:"t10",sel:"#v-shop .up",g:"think"},
  {k:"t11",sel:"#t-dig",wait:"view:dig",x:"navDig",g:"cheer"}
];
let tutI=-1,tutReplay=false,tutTimer=null;
function startTut(replay){tutReplay=!!replay;if(!replay&&!SS().tut)SS().tut="begonnen";tutI=-1;tutGo(0)}
function tutGo(i){
  while(i<TUT.length&&TUT[i].skipIf&&TUT[i].skipIf())i++;
  tutI=i;document.querySelectorAll(".coach,.coach-spot").forEach(e=>e.remove());clearInterval(tutTimer);
  if(i>=TUT.length){endTut(true);return}
  const st=TUT[i],spot=document.createElement("div"),box=document.createElement("div");
  spot.className="coach-spot"+(st.wait?" ring":"");box.className="coach";box.setAttribute("role","dialog");box.setAttribute("aria-live","polite");
  const showNext=!st.wait||tutReplay;
  box.innerHTML=`<img class="guide" src="${aurl(gpose(st.g))}" alt=""><b>${t(st.k+"h")}</b><p>${t(st.k,{x:st.x?t(st.x):""})}</p>
    <div class="crow"><div class="dots">${TUT.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>
    <div><button class="skip" data-tut="skip">${t("tutSkip")}</button>${showNext?` <button class="btn primary" data-tut="next">${i===TUT.length-1&&!st.wait?t("letsGo"):t("tutNext")}</button>`:""}</div></div>`;
  document.body.append(spot,box);
  box.addEventListener("click",e=>{const b=e.target.closest("[data-tut]");if(!b)return;e.stopPropagation();SFX.click();b.dataset.tut==="skip"?endTut(false):tutGo(tutI+1)});
  const el=st.sel&&document.querySelector(st.sel);
  if(el&&!el.closest("nav")){const r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-90)el.scrollIntoView({block:"center",behavior:"smooth"})}
  const place=()=>{
    const hide=!!document.querySelector(".overlay,.title");spot.hidden=box.hidden=hide;if(hide)return;
    const t=st.sel&&document.querySelector(st.sel);
    if(!t){spot.style.cssText="left:50%;top:50%;width:0;height:0";box.style.top="";box.style.bottom=`calc(${Math.round(innerHeight*.5)-80}px)`;return}
    const r=t.getBoundingClientRect(),p=6;
    spot.style.cssText=`left:${r.left-p}px;top:${r.top-p}px;width:${r.width+2*p}px;height:${r.height+2*p}px`;
    const bh=box.offsetHeight,below=innerHeight-r.bottom-p-12,above=r.top-p-12;
    if(r.top+r.height/2>innerHeight/2&&above>=bh){box.style.top="";box.style.bottom=(innerHeight-r.top+p+12)+"px"}
    else if(below>=bh){box.style.bottom="";box.style.top=(r.bottom+p+12)+"px"}
    else{box.style.bottom="";box.style.top="calc(12px + env(safe-area-inset-top,0px))"}
  };
  place();tutTimer=setInterval(place,150);
}
function tutEvent(ev){if(tutI<0||tutI>=TUT.length)return;if(TUT[tutI].wait===ev)tutGo(tutI+1)}
function endTut(done){if(!tutReplay)SS().tut=done?"bis zum Ende gespielt":"übersprungen bei Schritt "+(tutI+1)+" von "+TUT.length;clearInterval(tutTimer);document.querySelectorAll(".coach,.coach-spot").forEach(e=>e.remove());tutI=-1;S.tutDone=1;save();if(done)toast(t("tutDone"));setTimeout(()=>{try{maybeAskNotif()}catch(e){}},2500)}

function showTitle(){
  const el=document.createElement("div");el.className="title";el.setAttribute("role","dialog");el.setAttribute("aria-label","Fossiland");
  const draw=()=>{el.innerHTML=`<div class="ttop"><h1>Fossi<span>land</span></h1><p class="tagline">${t("tagline")}</p></div><div class="tbot">
    <button class="btn primary" id="playBtn">${t("play")}</button>
    <div class="langpick">${Object.entries(LANGS).map(([k,v])=>`<button data-tl="${k}" lang="${k}" aria-pressed="${k===LANG}">${v}</button>`).join("")}</div></div>`};
  draw();document.body.appendChild(el);
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();
    if(b.dataset.tl){S.lang=b.dataset.tl;applyLang(S.lang);save();draw();renderMute();renderTop();erasKey="";if(D)renderDig();return}
    if(b.id==="playBtn"){SFX.click();el.remove();const now=Date.now();statSession();if(!S.lastPlay||S.lastPlayDay!==today()||now-S.lastPlay>=45*60000){dqAdd("visits");S.lastPlay=now;S.lastPlayDay=today();save()}startGame()}});
}
function startGame(){
  if(FIRST&&!S.tutDone){startTut(false)}
  else{if(!S.tutDone){S.tutDone=1;save()}showOffline();
    if(rescuable()&&S.rescueAsk!==today()){S.rescueAsk=today();save();
      const tryOpen=()=>{if(document.querySelector(".overlay")){setTimeout(tryOpen,700);return}showDQ()};setTimeout(tryOpen,500)}}
}

/* ================= Allgemein ================= */
function renderTop(){$("coins").textContent=Math.floor(S.coins);const r=rate();$("rate").textContent=r?t("rateTop",{r}):""}
let view="dig";
function show(v){setTimeout(()=>tutEvent("view:"+v),60);view=v;["dig","mus","lab","shop"].forEach(k=>{$("v-"+k).hidden=k!==v;$("t-"+k).setAttribute("aria-selected",k===v)});window.scrollTo(0,0);if(v==="mus")renderMus();if(v==="lab"){renderLab();setTimeout(()=>{try{maybeAskNotif()}catch(e){}},600)}if(v==="shop")renderShop();if(v==="dig"){sizePit();drawScene();renderDig()}}
let tt;function toast(m){const t=$("toast");t.textContent=m;t.dataset.show=1;clearTimeout(tt);tt=setTimeout(()=>t.dataset.show=0,2000)}

function cellAt(ev){const r=pit.getBoundingClientRect();const x=Math.floor((ev.clientX-r.left)/(r.width/COLS)),y=Math.floor((ev.clientY-r.top)/(r.height/ROWS));return x>=0&&x<COLS&&y>=0&&y<ROWS?y*COLS+x:-1}
// Tippen = Finger auf dem Feld ablegen und ohne nennenswerte Bewegung loslassen. Wer zieht oder scrollt, löst nichts aus.
let tap=null;const TAP_MOVE=10;
pit.addEventListener("pointerdown",e=>{if(e.button>0)return;tap={id:e.pointerId,x:e.clientX,y:e.clientY,i:cellAt(e)}});
pit.addEventListener("pointermove",e=>{if(tap&&e.pointerId===tap.id&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>TAP_MOVE)tap=null});
pit.addEventListener("pointerup",e=>{const s=tap;tap=null;if(!s||e.pointerId!==s.id)return;
  if(Math.hypot(e.clientX-s.x,e.clientY-s.y)>TAP_MOVE)return;kc.on=false;if(s.i>=0)hit(s.i)});
["pointercancel","pointerleave"].forEach(n=>pit.addEventListener(n,()=>{tap=null}));
pit.addEventListener("keydown",e=>{const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
  if(mv){e.preventDefault();kc.on=true;kc.r=Math.max(0,Math.min(ROWS-1,kc.r+mv[0]));kc.c=Math.max(0,Math.min(COLS-1,kc.c+mv[1]))}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();kc.on=true;hit(kc.r*COLS+kc.c)}});

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.closest(".overlay"))return;
  if(b.dataset.tool!=="probe")SFX.click();
  if(b.id==="mute"){S.sound=!S.sound;save();renderMute();if(S.sound)SFX.click()}
  else if(b.id==="refill")showRewardedAd(t("plusEnergy"),()=>{S.st+=AD_STA;save();renderDig()});
  else if(b.dataset.speed){const u=+b.dataset.speed;showRewardedAd(t("labAd"),()=>labSkip(u))}
  else if(b.dataset.cskip){const u=+b.dataset.cskip,p=buyPrice();if(S.coins>=p){S.coins-=p;countBuy();stat("buyLab");SS().spent+=p;SFX.coin();labSkip(u)}}
  else if(b.id==="t-lab")show("lab");
  else if(b.id==="dqBtn")showDQ();
  else if(b.id==="report")showReport();
  else if(b.id==="tutReplay"){show("dig");startTut(true)}
  else if(b.id==="notifT"){notifEnable(!S.notif)}
  else if(b.dataset.lang){S.lang=b.dataset.lang;applyLang(S.lang);save();renderMute();renderTop();erasKey="";if(D)renderDig();show("shop")}
  else if(b.id==="probead")showRewardedAd(t("probeAd"),()=>{D.probes++;D.adProbe=true;tool="probe";renderDig()});
  else if(b.id==="t-dig")show("dig");else if(b.id==="t-mus")show("mus");else if(b.id==="t-shop")show("shop");
  else if(b.dataset.tool){tool=b.dataset.tool;renderDig();if(tool==="probe")tutEvent("probeSel")}
  else if(b.dataset.era){const v=+b.dataset.era;if(v!==S.era){S.era=v;save();drawScene();newDig()}}
  else if(b.id==="again"){S.digs++;save();newDig()}
  else if(b.id==="quit"){stat("digsQuit");D.over=true;renderDig();showResult()}
  else if(b.dataset.up){const k=b.dataset.up,c=costs[k]();if(c&&S.coins>=c){S.coins-=c;SS().spent+=c;tickStamina(Date.now());S[k+"Lv"]++;statEv(({energy:"Feldflasche",regen:"Feldküche",bench:"Werkbank",prec:"Präzisionshacke",probe:"Bodensonde"}[k]||k)+" Stufe "+S[k+"Lv"]+" gekauft ("+c+" Münzen)");tickLab(Date.now());save();SFX.coin();renderShop();toast(t("upgraded"))}}
  else if(b.id==="reset"){const ov=overlay(`<h2>${t("resetQ")}</h2><p class="sub">${t("resetSub")}</p><div class="row"><button class="btn" id="rno">${t("keep")}</button><button class="btn primary" id="ryes">${t("del")}</button></div>`);
    ov.addEventListener("click",ev=>{const x=ev.target.closest("button");if(!x)return;ev.stopPropagation();ov.remove();if(x.id==="ryes"){{const lg=S.lang;S=blank();S.lang=lg}S.st=energyMax();S.stT=Date.now();S.fullDay=today();offline=0;D=null;save();renderMute();show("dig");toast(t("newGame"))}})}
  renderTop();
});

let lastShop=0;
setInterval(()=>{S.coins+=rate()/3600;tickAll();renderTop();if(view==="shop"&&Date.now()-lastShop>2000){lastShop=Date.now();renderShop()}},1000);
setInterval(save,5000);
try{new ResizeObserver(()=>{sizePit();drawScene()}).observe(pit)}catch(e){addEventListener("resize",()=>{sizePit();drawScene()})}
if(document.fonts)document.fonts.ready.then(()=>{sizePit();drawScene()});
{const now=Date.now();QUIET=true;tickStamina(now);AWAY=tickLab(now);QUIET=false;
  if(S.fullDay!==today()){const first=!S.fullDay;S.fullDay=today();if(!first){S.st+=20;DAILY=true}}}
renderMute();renderTop();sizePit();drawScene();restoreDig()||newDig();renderNavBadge();preload();requestAnimationFrame(loop);showTitle();
</script>
